              <button onclick="printMatchScorecard('${m.id}')" class="tap-btn px-3.5 py-2 rounded-xl bg-white/90 text-slate-950 font-extrabold text-xs">🖨️ Print</button>
            </div>
          </div>
        `;
      } else if (m.inningsBreak) {
        equationHtml = `
          <div class="bg-amber-400 text-slate-950 rounded-2xl p-4 text-center font-black text-sm sm:text-lg shadow-lg">
            ⏳ INNINGS BREAK • ${escapeHtml(getTeamName(m.innings[1].battingTeamId))} NEED ${s1.runs + 1} RUNS IN ${maxOvers} OVERS (RRR ${formatRate((s1.runs + 1) / maxOvers)})
          </div>
        `;
      } else if (m.currentInnings === 2) {
        const target = s1.runs + 1;
        const need = Math.max(0, target - stats.runs);
        const ballsLeft = Math.max(0, maxOvers * bpo - stats.totalLegalBalls);
        const rrr = ballsLeft > 0 ? (need / (ballsLeft / bpo)) : 0;
        equationHtml = `
          <div class="bg-emerald-500/15 border border-emerald-400/40 rounded-2xl p-3.5 sm:p-4 grid grid-cols-3 gap-2 text-center">
            <div>
              <div class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">Target</div>
              <div class="text-xl sm:text-2xl font-black text-white">${target}</div>
            </div>
            <div>
              <div class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-emerald-300">Equation</div>
              <div class="text-lg sm:text-2xl font-black text-emerald-400">${need} <span class="text-xs sm:text-base font-bold text-emerald-200">off ${ballsLeft}b</span></div>
            </div>
            <div>
              <div class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-300">Req RR</div>
              <div class="text-xl sm:text-2xl font-black text-amber-400">${formatRate(rrr)}</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          ${switcherBar}

          <!-- Main High-Contrast Broadcast Scoreboard -->
          <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider ${m.status === 'live' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}">
                  ${m.status === 'live' ? '<span class="w-1.5 h-1.5 rounded-full bg-white live-dot"></span> LIVE' : '✓ FINAL'}
                </span>
                <span class="text-xs sm:text-sm font-bold text-slate-300">${escapeHtml(m.label)} • ${escapeHtml(m.stage)}</span>
                ${isGirls ? `<span class="px-2.5 py-1 rounded-full bg-pink-600 text-white text-[11px] font-black uppercase">👩 Girl's Over (Strict ${bpo}b • WD/NB=2)</span>` : ''}
              </div>
              <span class="text-xs font-bold text-slate-400">${m.currentInnings === 1 && m.status === 'live' ? '1ST INNINGS' : (m.status === 'live' ? '2ND INNINGS' : 'MATCH COMPLETE')}</span>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
              <div class="min-w-0">
                <div class="text-2xl sm:text-4xl lg:text-5xl font-black tracking-tight text-white truncate">${escapeHtml(getTeamName(inn.battingTeamId))}</div>
                <div class="text-xs sm:text-base font-semibold text-slate-400 mt-1">
                  vs ${escapeHtml(getTeamName(inn.bowlingTeamId))}
                  ${m.currentInnings === 2 || m.status === 'completed' ? ` • 1st Inn: <strong class="text-slate-200">${s1.runs}/${s1.wickets} (${s1.oversDisplay})</strong>` : ''}
                </div>
              </div>

              <div class="sm:text-right shrink-0">
                <div class="text-5xl sm:text-7xl font-black leading-none tracking-tight text-emerald-400">
                  ${stats.runs}<span class="text-slate-600">/</span>${stats.wickets}
                </div>
                <div class="mt-2 flex sm:justify-end items-center gap-3 text-sm sm:text-lg font-bold text-slate-200">
                  <span>OVERS <strong class="text-white">${stats.oversDisplay}</strong> / ${maxOvers}.0</span>
                  <span class="text-slate-600">|</span>
                  <span>CRR <strong class="text-amber-400">${formatRate(crr)}</strong></span>
                </div>
              </div>
            </div>
          </div>

          ${equationHtml}

          <!-- Active Batters & Bowler Broadcast Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-3.5">
            <!-- Active Batters Table -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-4 py-2.5 bg-slate-950/60 border-b border-slate-800 flex items-center justify-between">
                <span class="text-[11px] font-black uppercase tracking-wider text-emerald-400">🏏 At The Crease</span>
                <span class="text-[11px] text-slate-400 font-semibold">Extras: ${stats.extras}</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs sm:text-sm">
                  <thead class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-950/40">
                    <tr>
                      <th class="py-2 pl-4 pr-2 text-left">Batter</th>
                      <th class="py-2 px-2 text-right">R</th>
                      <th class="py-2 px-2 text-right">B</th>
                      <th class="py-2 px-2 text-right">4s</th>
                      <th class="py-2 px-2 text-right">6s</th>
                      <th class="py-2 pl-2 pr-4 text-right">SR</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800">
                    <tr class="bg-emerald-500/10">
                      <td class="py-3 pl-4 pr-2 font-black text-white whitespace-nowrap">${escapeHtml(getPlayerName(inn.strikerId, '-'))} <span class="text-emerald-400">*</span></td>
                      <td class="py-3 px-2 text-right font-black text-emerald-400 text-base">${striker.runs}</td>
                      <td class="py-3 px-2 text-right text-slate-300">${striker.balls}</td>
                      <td class="py-3 px-2 text-right text-slate-300">${striker.fours}</td>
                      <td class="py-3 px-2 text-right text-slate-300">${striker.sixes}</td>
                      <td class="py-3 pl-2 pr-4 text-right font-mono text-slate-300">${sr1}</td>
                    </tr>
                    <tr>
                      <td class="py-3 pl-4 pr-2 font-bold text-slate-200 whitespace-nowrap">${escapeHtml(getPlayerName(inn.nonStrikerId, '-'))}</td>
                      <td class="py-3 px-2 text-right font-bold text-white text-base">${nonStriker.runs}</td>
                      <td class="py-3 px-2 text-right text-slate-400">${nonStriker.balls}</td>
                      <td class="py-3 px-2 text-right text-slate-400">${nonStriker.fours}</td>
                      <td class="py-3 px-2 text-right text-slate-400">${nonStriker.sixes}</td>
                      <td class="py-3 pl-2 pr-4 text-right font-mono text-slate-400">${sr2}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Active Bowler Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between">
              <div class="px-4 py-2.5 bg-slate-950/60 border-b border-slate-800">
                <span class="text-[11px] font-black uppercase tracking-wider text-sky-400">⚾ Current Bowler</span>
              </div>
              <div class="p-4 flex-1 flex flex-col justify-center">
                <div class="text-lg sm:text-xl font-black text-white truncate">${curOver && curOver.bowlerId ? escapeHtml(getPlayerName(curOver.bowlerId)) : 'Selecting Bowler...'}</div>
                ${bowler ? `
                  <div class="grid grid-cols-4 gap-2 mt-3 text-center">
                    <div class="bg-slate-950 rounded-xl py-2"><div class="text-[10px] text-slate-400 font-bold">O</div><div class="font-black text-white">${ballsToOversStr(bowler.legalBalls, bpo)}</div></div>
                    <div class="bg-slate-950 rounded-xl py-2"><div class="text-[10px] text-slate-400 font-bold">R</div><div class="font-black text-white">${bowler.runsConceded}</div></div>
                    <div class="bg-slate-950 rounded-xl py-2"><div class="text-[10px] text-sky-400 font-bold">W</div><div class="font-black text-sky-400">${bowler.wickets}</div></div>
                    <div class="bg-slate-950 rounded-xl py-2"><div class="text-[10px] text-slate-400 font-bold">ECON</div><div class="font-bold text-slate-200 font-mono text-xs pt-0.5">${bwEcon}</div></div>
                  </div>
                ` : `<div class="text-xs text-slate-500 mt-2">Waiting for bowler selection</div>`}
              </div>
            </div>
          </div>

          <!-- Current Over Ball-by-Ball Strip -->

              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">

                ${curOver.balls.length === 0

                  : curOver.balls.map(b => renderBallPill(b)).join('')
                }
              </div>
              <button onclick="appSession.tvShowInlineScorecard = !appSession.tvShowInlineScorecard; render();" class="tap-btn px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 font-bold text-xs shrink-0 transition">
                ${appSession.tvShowInlineScorecard ? '▲ Hide Full Scorecard' : '▼ Show Full Scorecard'}
              </button>
            </div>
          ` : ''}

          ${appSession.tvShowInlineScorecard ? renderMiniScorecard(inn, stats, `${m.currentInnings === 1 ? '1st' : '2nd'} Innings Full Scorecard`, true) : ''}
        </div>
      `;
    }

          ${stages.map(st => {
            const list = state.matches.filter(st.filter);
            return `
              <div class="space-y-2.5">

                    const t1 = getTeamName(m.team1Id, m.seed1 || 'TBD');

                      : m.status === 'completed'
                        ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold uppercase">FINAL</span>`
                        : `<span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 text-[10px] font-bold">${m.time}</span>`;

                    return `
                      <div ${clickable ? `onclick="openScorecardModal('${m.id}')"` : ''} class="bg-slate-900 border ${m.stage === 'Final' ? 'border-amber-500/50' : 'border-slate-800'} rounded-2xl p-4 transition ${clickable ? 'cursor-pointer hover:border-emerald-500/60 hover:bg-slate-900/80' : 'opacity-90'}">

                            ${m.roundNote ? `<span class="text-slate-500 font-semibold">• ${m.roundNote}</span>` : ''}
                            <span class="text-[10px] px-1.5 py-0.5 rounded ${isGirlsOverEnabledForMatch(m) ? 'bg-pink-500/20 text-pink-300' : 'bg-sky-500/20 text-sky-300'}">${isGirlsOverEnabledForMatch(m) ? 'Mixed' : 'Boys'}</span>
                          </div>
                          ${badge}
                        </div>

                        ${m.status === 'upcoming' ? `
                          <div class="text-sm sm:text-base font-black text-white">${escapeHtml(t1)} <span class="text-slate-500 mx-1">vs</span> ${escapeHtml(t2)}</div>
                        ` : `
                          <div class="space-y-1 text-sm">
                            <div class="flex justify-between font-bold text-white">
                              <span>${escapeHtml(getTeamName(m.innings[0].battingTeamId))}</span>
                              <span class="font-black text-emerald-300">${s1.runs}/${s1.wickets} <span class="text-xs font-normal text-slate-400">(${s1.oversDisplay})</span></span>
                            </div>
                            ${m.currentInnings === 2 || m.status === 'completed' ? `
                              <div class="flex justify-between font-bold text-white">
                                <span>${escapeHtml(getTeamName(m.innings[1].battingTeamId))}</span>
                                <span class="font-black text-emerald-300">${s2.runs}/${s2.wickets} <span class="text-xs font-normal text-slate-400">(${s2.oversDisplay})</span></span>

                            <span class="text-[11px] font-extrabold text-sky-400 shrink-0">View Scorecard →</span>

            `;
          }).join('')}

    function renderStandingsCard(title, rows, darkTheme = false) {
      const cardCls = darkTheme ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900';
      const headCls = darkTheme ? 'bg-slate-950/80 text-slate-400' : 'bg-slate-50 text-slate-500';
      const rowBorder = darkTheme ? 'border-slate-800' : 'border-slate-100';

      return `
        <div class="rounded-2xl border shadow-sm overflow-hidden ${cardCls}">
          <div class="bg-slate-950 text-white px-4 py-3 flex items-center justify-between gap-2 border-b border-slate-800">
            <h3 class="text-xs sm:text-sm font-extrabold tracking-wide">${escapeHtml(title)}</h3>
            <span class="text-[10px] font-bold text-emerald-400 uppercase">#1 Q1 • #2 ELIM</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs sm:text-sm">
              <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                <tr>
                  <th class="py-2.5 pl-3 pr-2 text-left">Team</th>
                  <th class="py-2.5 px-2 text-center">P</th>
                  <th class="py-2.5 px-2 text-center">W</th>
                  <th class="py-2.5 px-2 text-center">L</th>
                  <th class="py-2.5 px-2 text-center">T</th>
                  <th class="py-2.5 px-2 text-center">Pts</th>
                  <th class="py-2.5 pl-2 pr-3 text-right">NRR</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((r, i) => {
                  const rowBg = i < 2 ? (darkTheme ? 'bg-emerald-500/10' : 'bg-emerald-50/50') : '';
                  const badge = i === 0 ? 'Q1' : (i === 1 ? 'ELIM' : '');
                  return `
                    <tr class="border-t ${rowBorder} ${rowBg}">
                      <td class="py-3 pl-3 pr-2 font-bold whitespace-nowrap">
                        <div class="flex items-center gap-2">
                          <span class="w-5 h-5 rounded-full text-[11px] font-black flex items-center justify-center ${i === 0 ? 'bg-emerald-500 text-slate-950' : (i === 1 ? 'bg-sky-500 text-slate-950' : (darkTheme ? 'bg-slate-800 text-slate-400' : 'bg-slate-200 text-slate-600'))}">${i + 1}</span>
                          <span>${escapeHtml(r.name)}</span>
                          ${badge ? `<span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded ${i === 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-sky-500/20 text-sky-400'}">${badge}</span>` : ''}
                        </div>
                      </td>
                      <td class="py-3 px-2 text-center opacity-80">${r.played}</td>
                      <td class="py-3 px-2 text-center font-bold text-emerald-500">${r.won}</td>

                      <td class="py-3 px-2 text-center font-black text-sm">${r.pts}</td>
                      <td class="py-3 pl-2 pr-3 text-right font-mono font-bold text-xs ${r.nrr >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${formatNRR(r.nrr)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

            </div>
          </div>
        </div>
      `;

            <div>
              <div class="text-[11px] font-extrabold uppercase tracking-widest opacity-90">${title}</div>

        : data.battingList.map((p, i) => `
            <tr class="border-t ${rowBorder} text-xs sm:text-sm">
              <td class="py-2.5 pl-3 pr-2 font-black opacity-50">${i + 1}</td>
              <td class="py-2.5 px-2 font-bold whitespace-nowrap">${escapeHtml(p.name)}</td>
              <td class="py-2.5 px-2 opacity-70 text-xs whitespace-nowrap">${escapeHtml(p.teamName)}</td>
              <td class="py-2.5 px-2 text-center opacity-80">${p.batInns}</td>
              <td class="py-2.5 px-2 text-right font-black text-emerald-500">${p.runs}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.ballsFaced}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.fours}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.sixes}</td>
              <td class="py-2.5 pl-2 pr-3 text-right font-mono font-bold">${p.strikeRate.toFixed(1)}</td>
            </tr>
          `).join('');

      const bowlRows = data.bowlingList.length === 0
        ? `<tr><td colspan="8" class="py-6 text-center text-xs opacity-60">No bowling records yet.</td></tr>`
        : data.bowlingList.map((p, i) => `
            <tr class="border-t ${rowBorder} text-xs sm:text-sm">
              <td class="py-2.5 pl-3 pr-2 font-black opacity-50">${i + 1}</td>
              <td class="py-2.5 px-2 font-bold whitespace-nowrap">${escapeHtml(p.name)}</td>
              <td class="py-2.5 px-2 opacity-70 text-xs whitespace-nowrap">${escapeHtml(p.teamName)}</td>
              <td class="py-2.5 px-2 text-center opacity-80">${p.bowlInns}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.oversBowledDec.toFixed(1)}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.runsConceded}</td>
              <td class="py-2.5 px-2 text-right font-black text-sky-400">${p.wickets}</td>
              <td class="py-2.5 pl-2 pr-3 text-right font-mono font-bold">${p.economy.toFixed(2)}</td>
            </tr>
          `).join('');

      const mvpRows = data.mvpList.length === 0
        ? `<tr><td colspan="8" class="py-6 text-center text-xs opacity-60">No all-rounder records yet.</td></tr>`
        : data.mvpList.map((p, i) => `
            <tr class="border-t ${rowBorder} text-xs sm:text-sm">
              <td class="py-2.5 pl-3 pr-2 font-black opacity-50">${i + 1}</td>
              <td class="py-2.5 px-2 font-bold whitespace-nowrap">${escapeHtml(p.name)}</td>
              <td class="py-2.5 px-2 opacity-70 text-xs whitespace-nowrap">${escapeHtml(p.teamName)}</td>
              <td class="py-2.5 px-2 text-right font-bold">${p.runs}</td>
              <td class="py-2.5 px-2 text-right font-bold text-sky-400">${p.wickets}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.fours}</td>
              <td class="py-2.5 px-2 text-right opacity-80">${p.sixes}</td>
              <td class="py-2.5 pl-2 pr-3 text-right font-black text-amber-400">${p.mvpPoints}</td>
            </tr>
          `).join('');

      const activeTab = uiState.leaderboardView || 'batting';

      return `
        <div class="space-y-5">
          <div>
            <h2 class="text-lg sm:text-xl font-black ${darkTheme ? 'text-white' : 'text-slate-900'}">Tournament Awards & Leaderboards</h2>
            <p class="text-xs ${darkTheme ? 'text-slate-400' : 'text-slate-500'}">Auto-calculated from all live & completed matches (MVP: 1 pt/run, 20 pts/wkt, +2/four, +4/six)</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
            ${renderHero({
              icon: '🏏', title: 'Best Batsman', sub: 'Most Runs',
              p: data.bestBatsman,
              main: data.bestBatsman ? `${data.bestBatsman.runs} Runs` : '',
              detail: data.bestBatsman ? `SR ${data.bestBatsman.strikeRate.toFixed(1)} • ${data.bestBatsman.fours}x4 ${data.bestBatsman.sixes}x6` : '',
              grad: 'bg-gradient-to-br from-emerald-600 to-teal-700'
            })}
            ${renderHero({
              icon: '⚾', title: 'Best Bowler', sub: 'Most Wickets & Economy',
              p: data.bestBowler,
              main: data.bestBowler ? `${data.bestBowler.wickets} Wkts` : '',
              detail: data.bestBowler ? `Econ ${data.bestBowler.economy.toFixed(2)} • ${data.bestBowler.runsConceded} runs` : '',
              grad: 'bg-gradient-to-br from-sky-600 to-indigo-700'
            })}
            ${renderHero({
              icon: '🌟', title: 'Best All-Rounder (MVP)', sub: 'Overall Impact Points',
              p: data.bestAllRounder,
              main: data.bestAllRounder ? `${data.bestAllRounder.mvpPoints} Pts` : '',
              detail: data.bestAllRounder ? `${data.bestAllRounder.runs}r • ${data.bestAllRounder.wickets}w` : '',
              grad: 'bg-gradient-to-br from-amber-500 to-orange-600'
            })}
          </div>

          <div class="rounded-2xl border shadow-sm overflow-hidden ${cardCls}">
            <div class="p-3 border-b ${rowBorder} flex gap-2 flex-wrap">
              ${[
                { id: 'batting', label: '🏏 Top Batters' },
                { id: 'bowling', label: '⚾ Top Bowlers' },
                { id: 'mvp',     label: '🌟 MVP All-Rounders' }
              ].map(t => `
                <button onclick="uiState.leaderboardView='${t.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${activeTab === t.id ? 'bg-emerald-500 text-slate-950' : (darkTheme ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200')}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
            <div class="overflow-x-auto">
              ${activeTab === 'batting' ? `
                <table class="w-full">
                  <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                    <tr>
                      <th class="py-2.5 pl-3 pr-2 text-left">#</th>
                      <th class="py-2.5 px-2 text-left">Player</th>
                      <th class="py-2.5 px-2 text-left">Team</th>
                      <th class="py-2.5 px-2 text-center">Inn</th>
                      <th class="py-2.5 px-2 text-right">R</th>
                      <th class="py-2.5 px-2 text-right">B</th>
                      <th class="py-2.5 px-2 text-right">4s</th>
                      <th class="py-2.5 px-2 text-right">6s</th>
                      <th class="py-2.5 pl-2 pr-3 text-right">SR</th>
                    </tr>
                  </thead>
                  <tbody>${batRows}</tbody>
                </table>
              ` : activeTab === 'bowling' ? `
                <table class="w-full">
                  <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                    <tr>
                      <th class="py-2.5 pl-3 pr-2 text-left">#</th>
                      <th class="py-2.5 px-2 text-left">Player</th>
                      <th class="py-2.5 px-2 text-left">Team</th>
                      <th class="py-2.5 px-2 text-center">Inn</th>
                      <th class="py-2.5 px-2 text-right">Ov</th>
                      <th class="py-2.5 px-2 text-right">Runs</th>
                      <th class="py-2.5 px-2 text-right">Wkts</th>
                      <th class="py-2.5 pl-2 pr-3 text-right">Econ</th>
                    </tr>
                  </thead>
                  <tbody>${bowlRows}</tbody>
                </table>
              ` : `
                <table class="w-full">
                  <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                    <tr>
                      <th class="py-2.5 pl-3 pr-2 text-left">#</th>
                      <th class="py-2.5 px-2 text-left">Player</th>
                      <th class="py-2.5 px-2 text-left">Team</th>
                      <th class="py-2.5 px-2 text-right">Runs</th>
                      <th class="py-2.5 px-2 text-right">Wkts</th>
                      <th class="py-2.5 px-2 text-right">4s</th>
                      <th class="py-2.5 px-2 text-right">6s</th>
                      <th class="py-2.5 pl-2 pr-3 text-right">MVP Pts</th>
                    </tr>
                  </thead>
                  <tbody>${mvpRows}</tbody>
                </table>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderBallPill(b) {
      let cls = 'bg-slate-800 text-slate-200 border-slate-700';
      if (b.isWicket) cls = 'bg-rose-600 text-white border-rose-500';
      else if (b.runsBat === 6) cls = 'bg-indigo-600 text-white border-indigo-400';
      else if (b.runsBat === 4) cls = 'bg-emerald-500 text-slate-950 border-emerald-400';
      else if (b.extraType === 'WD' || b.extraType === 'NB') cls = 'bg-amber-400 text-slate-950 border-amber-300';
      else if (b.extraType === 'B' || b.extraType === 'LB') cls = 'bg-purple-500 text-white border-purple-400';
      return `<span class="inline-flex items-center justify-center min-w-[30px] h-7 px-2 rounded-full text-[11px] font-black border shrink-0 ${cls}">${escapeHtml(b.label)}</span>`;
    }

    function renderMiniScorecard(inn, stats, title, darkTheme = false) {
      const batters = Object.values(stats.battingMap).filter(b => b.batted);
      const bowlers = Object.values(stats.bowlingMap);
      const cardCls = darkTheme ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900';
      const headCls = darkTheme ? 'bg-slate-950/70 text-slate-400' : 'bg-slate-50 text-slate-500';
      const rowBorder = darkTheme ? 'border-slate-800' : 'border-slate-100';

      return `
        <div class="rounded-2xl border shadow-sm overflow-hidden ${cardCls}">
          <div class="px-4 py-2.5 ${darkTheme ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-900 text-white'} border-b flex items-center justify-between gap-2">
            <span class="text-xs font-extrabold tracking-wide">${escapeHtml(title)}</span>
            <span class="text-xs font-black text-emerald-400">${stats.runs}/${stats.wickets} (${stats.oversDisplay} ov)</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                <tr>
                  <th class="py-2 pl-3 pr-2 text-left">Batter</th>
                  <th class="py-2 px-2 text-left">Status</th>
                  <th class="py-2 px-2 text-right">R</th>
                  <th class="py-2 px-2 text-right">B</th>
                  <th class="py-2 px-2 text-right">4s</th>
                  <th class="py-2 px-2 text-right">6s</th>
                  <th class="py-2 pl-2 pr-3 text-right">SR</th>
                </tr>
              </thead>
              <tbody>
                ${batters.length === 0 ? `<tr><td colspan="7" class="py-4 text-center opacity-60">No batting records yet.</td></tr>` : batters.map(b => {
                  const sr = b.balls > 0 ? ((b.runs / b.balls) * 100).toFixed(1) : '0.0';
                  return `
                    <tr class="border-t ${rowBorder}">
                      <td class="py-2 pl-3 pr-2 font-bold whitespace-nowrap">${escapeHtml(getPlayerName(b.playerId))}${!b.out && !b.retiredHurt ? ' *' : ''}</td>
                      <td class="py-2 px-2 truncate max-w-[140px] ${b.retiredHurt ? 'text-amber-500 font-bold italic' : 'opacity-70'}">${escapeHtml(b.dismissalText)}</td>
                      <td class="py-2 px-2 text-right font-black">${b.runs}</td>
                      <td class="py-2 px-2 text-right opacity-80">${b.balls}</td>
                      <td class="py-2 px-2 text-right opacity-80">${b.fours}</td>
                      <td class="py-2 px-2 text-right opacity-80">${b.sixes}</td>
                      <td class="py-2 pl-2 pr-3 text-right font-mono opacity-80">${sr}</td>
                    </tr>
                  `;
                }).join('')}
                <tr class="border-t ${rowBorder} ${darkTheme ? 'bg-slate-950/50' : 'bg-slate-50'}">
                  <td colspan="2" class="py-2 pl-3 pr-2 font-bold">Extras (WD ${stats.widesTotal}, NB ${stats.nbTotal}, B ${stats.byesTotal}, LB ${stats.lbTotal})</td>
                  <td class="py-2 px-2 text-right font-black">${stats.extras}</td>
                  <td colspan="4" class="py-2 pl-2 pr-3 text-right font-black">Total: ${stats.runs}/${stats.wickets}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="overflow-x-auto border-t ${rowBorder}">
            <table class="w-full text-xs">
              <thead class="${headCls} text-[10px] uppercase tracking-wider font-bold">
                <tr>
                  <th class="py-2 pl-3 pr-2 text-left">Bowler</th>
                  <th class="py-2 px-2 text-right">O</th>
                  <th class="py-2 px-2 text-right">R</th>
                  <th class="py-2 px-2 text-right">W</th>
                  <th class="py-2 pl-2 pr-3 text-right">Econ</th>
                </tr>
              </thead>
              <tbody>
                ${bowlers.length === 0 ? `<tr><td colspan="5" class="py-4 text-center opacity-60">No bowling records yet.</td></tr>` : bowlers.map(bw => {
                  const ovDec = bw.legalBalls / (stats.bpo || 6);
                  const econ = ovDec > 0 ? (bw.runsConceded / ovDec).toFixed(2) : '0.00';
                  return `
                    <tr class="border-t ${rowBorder}">
                      <td class="py-2 pl-3 pr-2 font-bold whitespace-nowrap">${escapeHtml(getPlayerName(bw.playerId))}</td>
                      <td class="py-2 px-2 text-right">${ballsToOversStr(bw.legalBalls, stats.bpo)}</td>
                      <td class="py-2 px-2 text-right">${bw.runsConceded}</td>
                      <td class="py-2 px-2 text-right font-black text-sky-500">${bw.wickets}</td>
                      <td class="py-2 pl-2 pr-3 text-right font-mono">${econ}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderOversTimeline(inn, title) {
      if (!inn || !inn.overs || inn.overs.length === 0) return '';
      return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5">
          <div class="text-xs font-extrabold uppercase tracking-wider text-slate-500">${escapeHtml(title)}</div>
          <div class="space-y-2">
            ${inn.overs.map(ov => {
              const ovRuns = ov.balls.reduce((s, b) => s + b.totalRuns, 0);
              return `
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 border-b border-slate-100 last:border-0">
                  <span class="text-xs font-black text-slate-700 shrink-0 w-14">Ov ${ov.overNumber}${ov.isGirlsOver ? ' 👩' : ''}</span>
                  <div class="flex items-center gap-1.5 flex-1">
                    ${ov.balls.length === 0 ? `<span class="text-xs text-slate-400 italic">No balls yet</span>` : ov.balls.map(b => renderBallPill(b)).join('')}
                  </div>
                  <span class="text-xs font-extrabold text-slate-600 shrink-0 pl-2">${ovRuns}r</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 10. SCORER MODE VIEWS (LIVE CONSOLE, TOSS, BREAK, SUMMARY, SCHEDULE, SETUP)
     *************************************************************************/

    function openMatchInScorer(matchId) {
      if (!appSession.scorerUnlocked) return;
      state.activeMatchId = matchId;
      appSession.scorerTab = 'scorer';
      uiState.pendingExtra = null;
      uiState.summaryInningsTab = 0;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderScorerLiveTab() {
      const m = getMatchById(state.activeMatchId) || state.matches[0];
      const matchOpts = state.matches.map(item => {
        const icon = item.status === 'live' ? '🔴' : item.status === 'completed' ? '✅' : '🕒';
        return `<option value="${item.id}" ${item.id === m.id ? 'selected' : ''}>${icon} ${item.label} (${item.stage}): ${escapeHtml(getTeamName(item.team1Id, item.seed1 || 'TBD'))} vs ${escapeHtml(getTeamName(item.team2Id, item.seed2 || 'TBD'))}</option>`;
      }).join('');

      const toolbar = `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex items-center gap-2 flex-wrap">
          <select onchange="openMatchInScorer(this.value)" class="flex-1 min-w-[200px] bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold text-slate-900">
            ${matchOpts}
          </select>
          <button onclick="openMatchWeatherModal('${m.id}')" title="Adjust Overs / Balls / Weather" class="tap-btn px-3 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-800 font-bold text-xs">🌧️ Overs</button>
          <button onclick="confirmResetMatch('${m.id}')" title="Reset Match" class="tap-btn px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-xs">🔄 Reset</button>
        </div>
      `;

      let bodyHtml = '';
      if (m.status === 'upcoming') bodyHtml = renderTossCard(m);
      else if (m.status === 'completed') bodyHtml = renderCompletedMatchCard(m);
      else if (m.inningsBreak) bodyHtml = renderInningsBreakCard(m);
      else bodyHtml = renderActiveScorerConsole(m);

      return `<div class="space-y-4">${toolbar}${bodyHtml}</div>`;
    }

    function renderTossCard(m) {
      const maxOvers = getMatchOvers(m), bpo = getMatchBallsPerOver(m);
      const girlsOn = isGirlsOverEnabledForMatch(m);
      const readyTeams = Boolean(m.team1Id && m.team2Id);
      const canStart = readyTeams && m.tossWinnerId && m.tossDecision;

      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-5">
          <div class="text-center space-y-1">
            <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-700">${escapeHtml(m.label)} • ${escapeHtml(m.stage)} • ${m.time}</div>
            <h2 class="text-xl sm:text-2xl font-black text-slate-900">
              ${escapeHtml(getTeamName(m.team1Id, m.seed1 || 'TBD'))} <span class="text-slate-400">vs</span> ${escapeHtml(getTeamName(m.team2Id, m.seed2 || 'TBD'))}
            </h2>
            <p class="text-xs text-slate-500">${maxOvers} Overs (${bpo} balls/ov) • ${girlsOn ? "Ov 1: Girls Bat & Bowl (WD/NB = 2) • Ovs 2+: Boys Only" : "Boys-Only Batting & Bowling"}</p>
          </div>

          ${!readyTeams ? `
            <div class="bg-amber-50 border border-amber-300 rounded-xl p-4 text-center text-xs font-bold text-amber-900">
              Playoff teams are not finalized yet. Complete the earlier matches or use <strong>Schedule → Lock / Override Playoff Teams</strong>.
            </div>
          ` : `
            <div class="space-y-4 max-w-md mx-auto">
              <div>
                <div class="text-xs font-extrabold uppercase text-slate-500 mb-2">1. Who won the toss?</div>
                <div class="grid grid-cols-2 gap-2.5">
                  <button onclick="selectToss('${m.id}','winner','${m.team1Id}')" class="tap-btn py-3 px-3 rounded-xl font-bold text-sm border-2 ${m.tossWinnerId === m.team1Id ? 'border-emerald-600 bg-emerald-50 text-emerald-900' : 'border-slate-200 bg-slate-50 text-slate-700'}">${escapeHtml(getTeamName(m.team1Id))}</button>
                  <button onclick="selectToss('${m.id}','winner','${m.team2Id}')" class="tap-btn py-3 px-3 rounded-xl font-bold text-sm border-2 ${m.tossWinnerId === m.team2Id ? 'border-emerald-600 bg-emerald-50 text-emerald-900' : 'border-slate-200 bg-slate-50 text-slate-700'}">${escapeHtml(getTeamName(m.team2Id))}</button>
                </div>
              </div>

              <div>
                <div class="text-xs font-extrabold uppercase text-slate-500 mb-2">2. Elected to...</div>
                <div class="grid grid-cols-2 gap-2.5">
                  <button onclick="selectToss('${m.id}','decision','bat')" class="tap-btn py-3 px-3 rounded-xl font-bold text-sm border-2 ${m.tossDecision === 'bat' ? 'border-emerald-600 bg-emerald-50 text-emerald-900' : 'border-slate-200 bg-slate-50 text-slate-700'}">🏏 Bat First</button>
                  <button onclick="selectToss('${m.id}','decision','bowl')" class="tap-btn py-3 px-3 rounded-xl font-bold text-sm border-2 ${m.tossDecision === 'bowl' ? 'border-emerald-600 bg-emerald-50 text-emerald-900' : 'border-slate-200 bg-slate-50 text-slate-700'}">⚾ Bowl First</button>
                </div>
              </div>

              <button onclick="startMatchAfterToss('${m.id}')" ${canStart ? '' : 'disabled'} class="tap-btn w-full py-3.5 rounded-xl font-black text-sm transition ${canStart ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                Start Match & Begin 1st Innings →
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderInningsBreakCard(m) {
      const inn1 = m.innings[0], inn2 = m.innings[1];
      const s1 = computeInningsStats(inn1, m);
      const maxOvers = getMatchOvers(m);
      const target = s1.runs + 1;

      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
          <div class="bg-slate-900 text-white rounded-2xl p-5 text-center space-y-2">
            <div class="text-xs font-black uppercase tracking-widest text-amber-400">⏳ Innings Break</div>
            <div class="text-lg font-extrabold">${escapeHtml(getTeamName(inn1.battingTeamId))}: <span class="text-emerald-400">${s1.runs}/${s1.wickets}</span> (${s1.oversDisplay}/${maxOvers} ov)</div>
            <div class="text-2xl sm:text-3xl font-black text-white pt-1">Target: ${target} Runs</div>
            <div class="text-xs text-slate-300">${escapeHtml(getTeamName(inn2.battingTeamId))} need ${target} in ${maxOvers} overs (RRR ${formatRate(target / maxOvers)})</div>
          </div>

          <div class="flex gap-2.5">
            <button onclick="startSecondInnings('${m.id}')" class="tap-btn flex-1 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-md">Start 2nd Innings →</button>
            <button onclick="undoLastBall('${m.id}')" class="tap-btn px-4 py-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">↩️ Undo</button>
          </div>

          ${renderMiniScorecard(inn1, s1, `1st Innings: ${getTeamName(inn1.battingTeamId)}`, false)}
        </div>
      `;
    }

    function renderCompletedMatchCard(m) {
      const inn1 = m.innings[0], inn2 = m.innings[1];
      const s1 = computeInningsStats(inn1, m), s2 = computeInningsStats(inn2, m);
      const maxOvers = getMatchOvers(m);
      const isTied = m.result.winnerId === 'TIE';
      const activeInn = uiState.summaryInningsTab === 0 ? inn1 : inn2;
      const activeStats = uiState.summaryInningsTab === 0 ? s1 : s2;

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-900 text-white p-5 text-center space-y-2">
            <div class="text-xs font-extrabold uppercase tracking-widest text-emerald-400">🏆 Match Completed • ${escapeHtml(m.label)}</div>
            <div class="text-lg sm:text-2xl font-black">${escapeHtml(m.result.summaryText)}</div>
            <div class="grid grid-cols-2 gap-2.5 max-w-md mx-auto pt-2 text-xs">
              <div class="bg-slate-800 rounded-xl p-2.5">
                <div class="text-slate-400 font-bold truncate">${escapeHtml(getTeamName(inn1.battingTeamId))}</div>
                <div class="text-lg font-black text-white">${s1.runs}/${s1.wickets} <span class="text-xs font-normal text-slate-400">(${s1.oversDisplay}/${maxOvers})</span></div>
              </div>
              <div class="bg-slate-800 rounded-xl p-2.5">
                <div class="text-slate-400 font-bold truncate">${escapeHtml(getTeamName(inn2.battingTeamId))}</div>
                <div class="text-lg font-black text-white">${s2.runs}/${s2.wickets} <span class="text-xs font-normal text-slate-400">(${s2.oversDisplay}/${maxOvers})</span></div>
              </div>
            </div>
          </div>

          <div class="p-4 sm:p-5 space-y-4">
            ${isTied ? `
              <div class="bg-amber-50 border border-amber-300 rounded-2xl p-4 space-y-2.5">
                <div class="text-xs font-extrabold uppercase text-amber-900">⚡ Match Tied — Select Super Over Winner</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  <button onclick="setSuperOverWinner('${m.id}','${inn1.battingTeamId}')" class="tap-btn py-2 px-3 rounded-xl text-xs font-bold border ${m.result.superOverWinnerId === inn1.battingTeamId ? 'bg-emerald-600 text-white' : 'bg-white'}">🏆 ${escapeHtml(getTeamName(inn1.battingTeamId))}</button>
                  <button onclick="setSuperOverWinner('${m.id}','${inn2.battingTeamId}')" class="tap-btn py-2 px-3 rounded-xl text-xs font-bold border ${m.result.superOverWinnerId === inn2.battingTeamId ? 'bg-emerald-600 text-white' : 'bg-white'}">🏆 ${escapeHtml(getTeamName(inn2.battingTeamId))}</button>
                  <button onclick="setSuperOverWinner('${m.id}', null)" class="tap-btn py-2 px-3 rounded-xl text-xs font-bold border col-span-2 sm:col-span-1 ${!m.result.superOverWinnerId ? 'bg-slate-800 text-white' : 'bg-white'}">Keep Tie</button>
                </div>
              </div>
            ` : ''}

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              <button onclick="printMatchScorecard('${m.id}')" class="tap-btn py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm col-span-2 sm:col-span-1">🖨️ Print Scorecard</button>
              <button onclick="copyTextToClipboard(generateWhatsAppSummary(getMatchById('${m.id}')), 'WhatsApp summary copied!')" class="tap-btn py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm">📋 WhatsApp</button>
              <button onclick="undoLastBall('${m.id}')" class="tap-btn py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm">↩️ Undo Ball</button>
            </div>

            <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
              <button onclick="uiState.summaryInningsTab = 0; render();" class="flex-1 py-2 rounded-lg text-xs font-bold ${uiState.summaryInningsTab === 0 ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}">1st Inn: ${escapeHtml(getTeamName(inn1.battingTeamId))}</button>
              <button onclick="uiState.summaryInningsTab = 1; render();" class="flex-1 py-2 rounded-lg text-xs font-bold ${uiState.summaryInningsTab === 1 ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}">2nd Inn: ${escapeHtml(getTeamName(inn2.battingTeamId))}</button>
            </div>

            ${renderMiniScorecard(activeInn, activeStats, `${uiState.summaryInningsTab === 0 ? '1st' : '2nd'} Innings Scorecard`, false)}
          </div>
        </div>
      `;
    }

    function renderActiveScorerConsole(m) {
      const inn = m.innings[m.currentInnings - 1];
      const stats = computeInningsStats(inn, m);
      const maxOvers = getMatchOvers(m), bpo = getMatchBallsPerOver(m);
      const boysWktsLimit = getBoysWicketsLimit(m, inn.battingTeamId);
      const crr = stats.decimalOvers > 0 ? (stats.runs / stats.decimalOvers) : 0;

      const curOverIdx = inn.overs.length - 1;
      const currentOver = inn.overs[curOverIdx] || createOverObj(m, 1);
      const isGirls = Boolean(currentOver.isGirlsOver);
      const legalDeliveries = currentOver.balls.filter(b => b.isLegal).length;

      const battingRoster = getTeamPlayers(inn.battingTeamId);
      const dismissedIds = new Set(Object.values(stats.battingMap).filter(b => b.out).map(b => b.playerId));
      const availableBatters = battingRoster.filter(p => !dismissedIds.has(p.id));
      const girlBattersPool = availableBatters.filter(p => p.gender === 'girl');
      const boyBattersPool = availableBatters.filter(p => p.gender === 'boy');

      // STRICT GENDER SEPARATION: Girls only face Girls (Over 1); Boys only face Boys (Overs 2+)
      const selectableBatters = isGirls
        ? (girlBattersPool.length > 0 ? girlBattersPool : availableBatters)
        : (boyBattersPool.length > 0 ? boyBattersPool : availableBatters);

      const requiredGender = isGirls ? 'girl' : 'boy';
      const eligibleBowlers = getTeamPlayers(inn.bowlingTeamId, requiredGender);

      const strikerStats = stats.battingMap[inn.strikerId] || { runs: 0, balls: 0 };
      const nonStrikerStats = stats.battingMap[inn.nonStrikerId] || { runs: 0, balls: 0 };
      const bowlerStats = stats.bowlingMap[currentOver.bowlerId] || { legalBalls: 0, runsConceded: 0, wickets: 0 };

      let chaseBanner = '';
      if (m.currentInnings === 2) {
        const target = computeInningsStats(m.innings[0], m).runs + 1;
        const need = Math.max(0, target - stats.runs);
        const ballsLeft = Math.max(0, maxOvers * bpo - stats.totalLegalBalls);
        chaseBanner = `
          <div class="mt-3 pt-3 border-t border-slate-800 grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-slate-800 rounded-xl py-2"><div class="text-slate-400">Target</div><div class="text-base font-black">${target}</div></div>
            <div class="bg-emerald-500/15 border border-emerald-500/30 rounded-xl py-2"><div class="text-emerald-300">Need</div><div class="text-base font-black text-emerald-400">${need} off ${ballsLeft}b</div></div>
            <div class="bg-slate-800 rounded-xl py-2"><div class="text-slate-400">Req RR</div><div class="text-base font-black text-amber-400">${formatRate(ballsLeft > 0 ? need / (ballsLeft / bpo) : 0)}</div></div>
          </div>
        `;
      }

      let extraPanel = '';
      if (uiState.pendingExtra === 'WD') {
        const base = isGirls ? 2 : 1;
        extraPanel = `
          <div class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-3 space-y-2">
            <div class="flex justify-between items-center"><span class="text-xs font-extrabold text-amber-900">Wide (${base} run${base > 1 ? 's' : ''} • ${isGirls ? 'Counts as Legal Ball' : 'Extra Ball'})</span><button onclick="uiState.pendingExtra=null;render();" class="text-xs font-bold text-amber-700">Cancel</button></div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
              ${[0,1,2,3,4].map(r => `<button onclick="recordBall({extraType:'WD',extraRuns:${r}})" class="tap-btn py-2.5 rounded-xl ${r === 0 ? 'bg-amber-500 text-white' : 'bg-white border border-amber-300 text-amber-900'} font-extrabold text-sm">WD${r > 0 ? `+${r}` : `(${base})`}</button>`).join('')}
              <button onclick="recordBall({extraType:'WD',extraRuns:0,isWicket:true,outPlayerId:'${inn.strikerId || ''}',wicketDismissal:'stumped'})" class="tap-btn py-2.5 rounded-xl bg-rose-600 text-white font-bold text-sm">WD+Stmp</button>
            </div>
          </div>
        `;
      } else if (uiState.pendingExtra === 'NB') {
        const base = isGirls ? 2 : 1;
        extraPanel = `
          <div class="bg-orange-50 border-2 border-orange-400 rounded-2xl p-3 space-y-2">
            <div class="flex justify-between items-center"><span class="text-xs font-extrabold text-orange-900">No-Ball (${base} + Bat Runs • ${isGirls ? 'Counts as Legal Ball' : 'Extra Ball'})</span><button onclick="uiState.pendingExtra=null;render();" class="text-xs font-bold text-orange-700">Cancel</button></div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
              ${[0,1,2,3,4,6].map(r => `<button onclick="recordBall({extraType:'NB',runsBat:${r}})" class="tap-btn py-2.5 rounded-xl ${r === 0 ? 'bg-orange-500 text-white' : 'bg-white border border-orange-300 text-orange-900'} font-extrabold text-sm">NB${r > 0 ? `+${r}` : `(${base})`}</button>`).join('')}
            </div>
          </div>
        `;
      } else if (uiState.pendingExtra === 'BLB') {
        extraPanel = `
          <div class="bg-purple-50 border-2 border-purple-400 rounded-2xl p-3 space-y-2">
            <div class="flex justify-between items-center"><span class="text-xs font-extrabold text-purple-900">Bye / Leg-Bye (Legal Ball)</span><button onclick="uiState.pendingExtra=null;render();" class="text-xs font-bold text-purple-700">Cancel</button></div>
            <div class="grid grid-cols-4 gap-2">
              ${[1,2,3,4].map(r => `<button onclick="recordBall({extraType:'B',extraRuns:${r}})" class="tap-btn py-2 rounded-xl bg-white border border-purple-300 text-purple-900 font-bold text-sm">B ${r}</button>`).join('')}
              ${[1,2,3,4].map(r => `<button onclick="recordBall({extraType:'LB',extraRuns:${r}})" class="tap-btn py-2 rounded-xl bg-white border border-purple-300 text-purple-900 font-bold text-sm">LB ${r}</button>`).join('')}
            </div>
          </div>
        `;
      } else if (uiState.pendingExtra === 'W') {
        const retiredSet = new Set(Array.isArray(inn.retiredHurtIds) ? inn.retiredHurtIds : []);
        const nextBatters = selectableBatters
          .filter(p => p.id !== inn.strikerId && p.id !== inn.nonStrikerId)
          .sort((a, b) => Number(retiredSet.has(a.id)) - Number(retiredSet.has(b.id)));
        const teamBoys = getTeamPlayers(inn.battingTeamId, 'boy');
        const dismissedBoys = teamBoys.filter(b => stats.battingMap[b.id] && stats.battingMap[b.id].out).length;
        const willBeAllOut = isGirls
          ? false
          : (m.customWickets ? (stats.wickets + 1) >= Number(m.customWickets) : (dismissedBoys + 1) >= boysWktsLimit);
        const girlsRemainingAfterOut = isGirls
          ? Math.max(0, girlBattersPool.length - 1)
          : 99;
        const willEndGirlsOver = isGirls && (girlsRemainingAfterOut <= 0 || (getTeamPlayers(inn.battingTeamId, 'girl').length - girlsRemainingAfterOut) >= 2);
        const defaultNextId = uiState.wicketNextBatterId && nextBatters.some(p => p.id === uiState.wicketNextBatterId)
          ? uiState.wicketNextBatterId : (nextBatters[0] ? nextBatters[0].id : '');

        extraPanel = `
          <div class="bg-rose-50 border-2 border-rose-400 rounded-2xl p-3.5 space-y-3">
            <div class="flex justify-between items-center"><span class="text-xs font-extrabold uppercase text-rose-900">Record Wicket</span><button onclick="uiState.pendingExtra=null;render();" class="text-xs font-bold text-rose-700">Cancel</button></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold text-rose-800 uppercase mb-1">Batter Out</label>
                <div class="grid grid-cols-2 gap-1.5">
                  <button onclick="uiState.wicketOutTarget='striker';render();" class="py-2 px-2 rounded-lg text-xs font-bold border truncate ${uiState.wicketOutTarget === 'striker' ? 'bg-rose-600 text-white' : 'bg-white'}">${escapeHtml(getPlayerName(inn.strikerId, 'Striker'))}</button>
                  <button onclick="uiState.wicketOutTarget='nonStriker';render();" ${!inn.nonStrikerId ? 'disabled' : ''} class="py-2 px-2 rounded-lg text-xs font-bold border truncate ${!inn.nonStrikerId ? 'opacity-40 cursor-not-allowed bg-slate-100' : (uiState.wicketOutTarget === 'nonStriker' ? 'bg-rose-600 text-white' : 'bg-white')}">${escapeHtml(getPlayerName(inn.nonStrikerId, 'None'))}</button>
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-rose-800 uppercase mb-1">Dismissal Type</label>
                <select onchange="uiState.wicketDismissal=this.value;render();" class="w-full bg-white border border-rose-300 rounded-xl px-2.5 py-2 text-xs font-bold">
                  ${['bowled','caught','runout','stumped','lbw'].map(d => `<option value="${d}" ${uiState.wicketDismissal === d ? 'selected' : ''}>${d.toUpperCase()}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold text-rose-800 uppercase mb-1">Fielder (Optional)</label>
                <input id="wicket-fielder-input" type="text" value="${escapeHtml(uiState.wicketFielder)}" oninput="uiState.wicketFielder=this.value" placeholder="e.g., Fielder name" class="w-full bg-white border border-rose-300 rounded-xl px-2.5 py-2 text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-rose-800 uppercase mb-1">Runs on Ball</label>
                <div class="grid grid-cols-4 gap-1.5">
                  ${[0,1,2,3].map(r => `<button onclick="uiState.wicketRuns=${r};render();" class="py-1.5 rounded-lg text-xs font-bold border ${uiState.wicketRuns === r ? 'bg-rose-600 text-white' : 'bg-white'}">${r}</button>`).join('')}
                </div>
              </div>
            </div>
            ${willBeAllOut ? `<div class="text-xs font-extrabold text-rose-700 bg-rose-100 rounded-xl p-2 text-center">⚠️ Final Boy Wicket — Team All Out!</div>`
              : willEndGirlsOver ? `<div class="text-xs font-extrabold text-pink-900 bg-pink-100 border border-pink-300 rounded-xl p-2 text-center">👩 2nd Girl Out — Girl's Over will end immediately! Boys bat Over 2.</div>`
              : (isGirls && nextBatters.length === 0) ? `<div class="text-xs font-bold text-amber-900 bg-amber-100 rounded-xl p-2 text-center">👩 1 Girl remains at the crease for the rest of Over 1.</div>`
              : `
              <div>
                <label class="block text-[11px] font-bold text-rose-800 uppercase mb-1">Incoming ${isGirls ? 'Girl' : 'Boy'} Batter</label>
                <select id="wicket-next-batter" onchange="uiState.wicketNextBatterId=this.value" class="w-full bg-white border border-rose-300 rounded-xl px-2.5 py-2 text-xs font-bold">
                  ${nextBatters.length === 0 ? `<option value="">No remaining batters</option>` : nextBatters.map(p => `<option value="${p.id}" ${p.id === defaultNextId ? 'selected' : ''}>${escapeHtml(p.name)}${retiredSet.has(p.id) ? ' (Retired Hurt)' : ''}</option>`).join('')}
                </select>
              </div>
            `}
            <button onclick="confirmWicketBall('${inn.strikerId || ''}','${inn.nonStrikerId || ''}','${defaultNextId}')" class="tap-btn w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm">Confirm Wicket ✓</button>
          </div>
        `;
      }

      return `
        <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-lg">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[10px] font-extrabold uppercase tracking-wider text-rose-400">● LIVE • ${m.currentInnings === 1 ? '1ST INN' : '2ND INN'} • ${escapeHtml(m.label)}</div>
              <h2 class="text-lg sm:text-xl font-black truncate">${escapeHtml(getTeamName(inn.battingTeamId))}</h2>
              <p class="text-xs text-slate-400">vs ${escapeHtml(getTeamName(inn.bowlingTeamId))} • Boys all-out: ${boysWktsLimit} wkts</p>
            </div>
            <div class="text-right shrink-0">
              <div class="text-4xl font-black leading-none">${stats.runs}<span class="text-slate-500">/</span>${stats.wickets}</div>
              <div class="mt-1 text-xs font-bold text-emerald-400">Ov ${stats.oversDisplay}/${maxOvers}.0 • CRR ${formatRate(crr)}</div>
            </div>
          </div>
          ${chaseBanner}
        </div>

        <div class="flex items-center justify-between gap-2 px-4 py-2.5 rounded-2xl text-white shadow-sm ${isGirls ? 'bg-gradient-to-r from-pink-600 to-rose-600' : 'bg-gradient-to-r from-sky-700 to-indigo-700'}">
          <div class="text-xs sm:text-sm font-black uppercase tracking-wider">
            ${isGirls ? `👩 GIRL'S OVER — Girls Bat & Bowl • Both Girls Out = Over Ends • WD/NB = 2` : `👨 Over ${currentOver.overNumber} • Boy's Over (Boys Bat & Bowl • ${bpo} Legal Balls)`}
          </div>
          <span class="text-xs font-extrabold bg-white/20 px-2.5 py-1 rounded-lg shrink-0">${legalDeliveries}/${bpo}</span>
        </div>

        <!-- Batters & Bowler Controls -->
        <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5">
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="text-[11px] font-extrabold text-emerald-800">🏏 Striker (${isGirls ? 'Girl' : 'Boy'}) * (${strikerStats.runs}/${strikerStats.balls}b)</span>
                <div class="flex items-center gap-1">
                  ${inn.strikerId ? `<button onclick="openRetireHurtModal('${m.id}','striker')" class="text-[11px] font-bold bg-amber-50 text-amber-800 px-2 py-0.5 rounded border border-amber-300">🩹 Retire</button>` : ''}
                  <button onclick="swapStrike('${m.id}')" class="text-[11px] font-bold bg-white px-2 py-0.5 rounded border border-slate-200">⇄ Swap</button>
                </div>
              </div>
              <select onchange="setActiveBatter('${m.id}','striker',this.value)" class="w-full bg-white border border-emerald-300 rounded-lg px-2 py-1.5 text-xs font-bold">
                ${selectableBatters.map(p => `<option value="${p.id}" ${p.id === inn.strikerId ? 'selected' : ''}>${escapeHtml(p.name)}${stats.battingMap[p.id] && stats.battingMap[p.id].retiredHurt ? ' (Retired Hurt)' : ''}</option>`).join('')}
              </select>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2.5">
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="text-[11px] font-bold text-slate-600">Non-Striker (${isGirls ? 'Girl' : 'Boy'}) (${nonStrikerStats.runs}/${nonStrikerStats.balls}b)</span>
                ${inn.nonStrikerId ? `<button onclick="openRetireHurtModal('${m.id}','nonStriker')" class="text-[11px] font-bold bg-amber-50 text-amber-800 px-2 py-0.5 rounded border border-amber-300">🩹 Retire</button>` : ''}
              </div>
              <select onchange="setActiveBatter('${m.id}','nonStriker',this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold">
                ${!inn.nonStrikerId ? `<option value="" selected>— Solo Batter —</option>` : ''}
                ${selectableBatters.map(p => `<option value="${p.id}" ${p.id === inn.nonStrikerId ? 'selected' : ''}>${escapeHtml(p.name)}${stats.battingMap[p.id] && stats.battingMap[p.id].retiredHurt ? ' (Retired Hurt)' : ''}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="rounded-xl p-2.5 border ${!currentOver.bowlerId ? 'bg-amber-50 border-amber-400' : 'bg-slate-50 border-slate-200'}">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[11px] font-extrabold uppercase ${!currentOver.bowlerId ? 'text-amber-900' : 'text-slate-600'}">
                ⚾ Over ${currentOver.overNumber} Bowler (${isGirls ? 'Girls' : 'Boys'}) ${currentOver.bowlerId ? `• ${ballsToOversStr(bowlerStats.legalBalls, bpo)}-${bowlerStats.runsConceded}-${bowlerStats.wickets}` : ''}
              </span>
              <button onclick="openQuickAddPlayerModal('${inn.bowlingTeamId}','${requiredGender}',(pid)=>setCurrentBowler('${m.id}',pid))" class="text-[11px] font-bold text-emerald-700">+ Add</button>
            </div>
            <select onchange="setCurrentBowler('${m.id}',this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-xs font-bold">
              <option value="">-- Select ${isGirls ? 'Girl' : 'Boy'} Bowler --</option>
              ${eligibleBowlers.map(p => {
                const elig = getBowlerEligibility(inn, p, curOverIdx, isGirls);
                return `<option value="${p.id}" ${p.id === currentOver.bowlerId ? 'selected' : ''} ${(!elig.allowed && p.id !== currentOver.bowlerId) ? 'disabled' : ''}>${escapeHtml(p.name)} (${elig.remaining} ov left)</option>`;
              }).join('')}
            </select>
          </div>

          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
            <span class="text-[11px] font-extrabold text-slate-400 uppercase shrink-0">This Over:</span>
            ${currentOver.balls.length === 0 ? `<span class="text-xs text-slate-400 italic">Waiting for ball...</span>` : currentOver.balls.map(b => renderBallPill(b)).join('')}
          </div>
        </div>

        ${extraPanel}

        <!-- Fast Scoring Pad -->
        <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2.5">
          <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
            ${[0,1,2,3,4,6].map(r => `
              <button onclick="recordBall({runsBat:${r}})" class="tap-btn py-3.5 rounded-xl font-black text-xl transition ${r === 4 ? 'bg-emerald-500 text-white' : (r === 6 ? 'bg-indigo-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-900 border border-slate-200')}">${r}</button>
            `).join('')}
          </div>
          <div class="grid grid-cols-5 gap-2">
            <button onclick="uiState.pendingExtra=uiState.pendingExtra==='WD'?null:'WD';render();" class="tap-btn py-3 rounded-xl font-extrabold text-xs bg-amber-100 text-amber-900 border border-amber-300">${isGirls ? 'WD(2)' : 'WD'}</button>
            <button onclick="uiState.pendingExtra=uiState.pendingExtra==='NB'?null:'NB';render();" class="tap-btn py-3 rounded-xl font-extrabold text-xs bg-orange-100 text-orange-900 border border-orange-300">${isGirls ? 'NB(2)' : 'NB'}</button>
            <button onclick="uiState.pendingExtra=uiState.pendingExtra==='BLB'?null:'BLB';render();" class="tap-btn py-3 rounded-xl font-extrabold text-xs bg-purple-100 text-purple-900 border border-purple-300">B/LB</button>

    let toastTimer = null;
    function showToast(msg, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2600);
    }

    function showModal({ title, bodyHtml, actions }) {
      const overlay = document.getElementById('modal-overlay');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      actions.forEach(act => {
        const btn = document.createElement('button');
        btn.textContent = act.label;
        btn.className = act.className || 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-200 text-slate-800';
        btn.onclick = () => {
          const shouldClose = act.onClick ? act.onClick() : true;
          if (shouldClose !== false) closeModal();
        };
        actionsEl.appendChild(btn);
      });
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.classList.remove('max-w-3xl');
      box.classList.add('max-w-md');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function copyTextToClipboard(text, successMsg = 'Copied!') {
      try {
        const helper = document.getElementById('clipboard-helper');
        helper.value = text;
        helper.select();
        helper.setSelectionRange(0, 99999);
        if (document.execCommand('copy')) showToast(successMsg, '📋');
        else showToast('Could not copy automatically.', '⚠️');
      } catch (e) {
        showToast('Copy failed.', '⚠️');
      }
    }

            <div><label class="text-[11px] font-bold uppercase text-slate-500">Group A #1 (Q1)</label><select id="po-a1" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold">${opts(q.A1)}</select></div>
            <div><label class="text-[11px] font-bold uppercase text-slate-500">Group B #1 (Q1)</label><select id="po-b1" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold">${opts(q.B1)}</select></div>
            <div><label class="text-[11px] font-bold uppercase text-slate-500">Group A #2 (Eliminator)</label><select id="po-a2" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold">${opts(q.A2)}</select></div>
            <div><label class="text-[11px] font-bold uppercase text-slate-500">Group B #2 (Eliminator)</label><select id="po-b2" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold">${opts(q.B2)}</select></div>
          </div>
        `,
        actions: [
          { label: 'Auto-Seed', className: 'px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100', onClick: () => { state.playoffOverride = { locked: false, A1: null, B1: null, A2: null, B2: null }; syncPlayoffSeeding(); saveState(); render(); } },
          {
            label: 'Lock Teams',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white',
            onClick: () => {
              const A1 = document.getElementById('po-a1').value, B1 = document.getElementById('po-b1').value;
              const A2 = document.getElementById('po-a2').value, B2 = document.getElementById('po-b2').value;
              if (new Set([A1, B1, A2, B2].filter(Boolean)).size !== 4) { showToast('Select 4 distinct teams.', '⚠️'); return false; }
              state.playoffOverride = { locked: true, A1, B1, A2, B2 };
              syncPlayoffSeeding(); saveState(); render(); showToast('Playoff teams locked!', '🔒'); return true;
            }
          }
        ]
      });
    }

    function applySquadPreset(teamId, numBoys, numGirls) {
      if (!appSession.scorerUnlocked) return;
      const curBoys = getTeamPlayers(teamId, 'boy'), curGirls = getTeamPlayers(teamId, 'girl');
      if (curBoys.length < numBoys) {
        for (let i = curBoys.length + 1; i <= numBoys; i++) {
          const pid = `${teamId}_B_${Date.now().toString(36)}_${i}`;
          state.players[pid] = { id: pid, teamId, name: `${teamId} Boy ${i}`, gender: 'boy' };
        }
      } else if (curBoys.length > numBoys) curBoys.slice(numBoys).forEach(p => delete state.players[p.id]);

      if (curGirls.length < numGirls) {
        for (let g = curGirls.length + 1; g <= numGirls; g++) {
          const pid = `${teamId}_G_${Date.now().toString(36)}_${g}`;
          state.players[pid] = { id: pid, teamId, name: `${teamId} Girl ${g}`, gender: 'girl' };
        }
      } else if (curGirls.length > numGirls) curGirls.slice(numGirls).forEach(p => delete state.players[p.id]);

      saveState(); render(); showToast(`Set ${getTeamName(teamId)} to ${numBoys}B + ${numGirls}G!`, '👥');
    }

    function openQuickAddPlayerModal(teamId, defaultGender = 'boy', cb = null) {
      if (!appSession.scorerUnlocked) return;
      showModal({
        title: `Add Player to ${getTeamName(teamId)}`,
        bodyHtml: `
          <div class="space-y-3">
            <input id="qp-name" type="text" placeholder="Player Name" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold" />
            <select id="qp-gender" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold">
              <option value="boy" ${defaultGender === 'boy' ? 'selected' : ''}>👨 Boy</option>
              <option value="girl" ${defaultGender === 'girl' ? 'selected' : ''}>👩 Girl</option>
            </select>
          </div>
        `,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100' },
          {
            label: 'Add',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white',
            onClick: () => {
              const name = (document.getElementById('qp-name').value || '').trim();
              if (!name) { showToast('Enter a name.', '⚠️'); return false; }
              const pid = `${teamId}_P_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 5)}`;
              state.players[pid] = { id: pid, teamId, name, gender: document.getElementById('qp-gender').value };
              saveState(); if (cb) cb(pid); render(); showToast(`Added ${name}`, '👤'); return true;
            }
          }
        ]
      });
    }

    function updateTeamName(teamId, val) {
      if (!appSession.scorerUnlocked) return;
      state.teams[teamId].name = val.trim() || `Team ${teamId}`;
      saveState(); render(); showToast('Team renamed!', '✏️');
    }

    function updatePlayerField(pid, field, val) {
      if (!appSession.scorerUnlocked || !state.players[pid]) return;
      if (field === 'name' && !val.trim()) return;
      state.players[pid][field] = field === 'name' ? val.trim() : val;
      saveState(); render();
    }

    function deletePlayer(pid) {
      if (!appSession.scorerUnlocked || !state.players[pid]) return;
      delete state.players[pid];
      saveState(); render(); showToast('Player removed', '🗑️');
    }

    function updateSetting(key, val) {
      if (!appSession.scorerUnlocked) return;
      state.settings[key] = val;
      saveState(); render(); showToast('Setting updated!', '⚙️');
    }

    function confirmResetMatch(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m) return;
      showModal({
        title: `Reset ${m.label}?`,
        bodyHtml: `Clear all scores and toss data for <strong>${escapeHtml(m.label)}</strong>?`,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100' },
          {
            label: 'Reset Match',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white',
            onClick: () => {
              m.status = 'upcoming'; m.tossWinnerId = null; m.tossDecision = null;
              m.currentInnings = 0; m.inningsBreak = false;
              m.innings = [createEmptyInnings(), createEmptyInnings()];
              m.result = { winnerId: null, superOverWinnerId: null, summaryText: '' };
              syncPlayoffSeeding(); saveState(); render(); showToast(`${m.label} reset!`, '🔄');
            }
          }
        ]
      });
    }

    function confirmResetTournament() {
      confirmClearDatabase();
    }

    function confirmClearDatabase() {
      if (!appSession.scorerUnlocked) return;
      showModal({
        title: '🗑️ Clear Database & Start Again?',
        bodyHtml: `
          <div class="space-y-3">
            <p class="text-xs sm:text-sm text-slate-700">
              This will permanently wipe all saved scores and matches from <strong>Firebase (${ROOM_CODE})</strong> and this device, then start a fresh tournament for all watchers.
            </p>
            <label class="flex items-center gap-2.5 bg-slate-50 border border-slate-200 rounded-xl p-3 cursor-pointer">
              <input id="clear-db-keep-rosters" type="checkbox" class="w-4 h-4 accent-emerald-600 shrink-0" />
              <span class="text-xs font-bold text-slate-800">Keep my custom team names, players & rules (clear matches/scores only)</span>
            </label>
          </div>
        `,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700' },
          {
            label: '🗑️ Yes, Clear Database',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white',
            onClick: () => {
              const keepEl = document.getElementById('clear-db-keep-rosters');
              const keepRosters = Boolean(keepEl && keepEl.checked);
              executeClearDatabase(keepRosters);
            }
          }
        ]
      });
    }

    async function executeClearDatabase(keepRosters = false) {
      if (!appSession.scorerUnlocked) return;
      showToast('Clearing Firebase database...', '🗑️');
      clearTimeout(syncTimer);

      const savedTeams = keepRosters ? JSON.parse(JSON.stringify(state.teams)) : null;
      const savedPlayers = keepRosters ? JSON.parse(JSON.stringify(state.players)) : null;
      const savedSettings = keepRosters ? JSON.parse(JSON.stringify(state.settings)) : null;

      try {
        // 1. Delete existing tournament node from Firebase Realtime Database
        const delRes = await fetch(RTDB_ENDPOINT, { method: 'DELETE' });
        if (!delRes.ok) throw new Error(`HTTP ${delRes.status}`);
      } catch (err) {
        console.error('RTDB delete error:', err);
        showToast('Could not reach Firebase to delete — resetting locally.', '⚠️');
      }

      // 2. Clear local storage state & build a fresh tournament
      try { localStorage.removeItem(STORAGE_STATE_KEY); } catch (e) {}
      state = createDefaultState();
      if (keepRosters) {
        state.teams = savedTeams;
        state.players = savedPlayers;
        state.settings = savedSettings;
      }
      state.updatedAt = Date.now();
      appSession.lastRemoteUpdatedAt = 0;
      appSession.pinnedTvMatchId = null;
      appSession.scorerTab = 'scorer';
      uiState.pendingExtra = null;
      uiState.summaryInningsTab = 0;

      // 3. Save locally & immediately push clean state to Firebase so all watchers reset
      try { localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state)); } catch (e) {}
      saveSession();
      render();
      await pushStateToCloudImmediate();
      showToast(keepRosters ? 'Database cleared! Rosters kept — ready for Match 1.' : 'Database cleared! Fresh tournament ready.', '✅');
    }

    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cricket-${appSession.roomCode}-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('JSON backup downloaded!', '💾');
      } catch (e) { copyTextToClipboard(JSON.stringify(state), 'JSON copied!'); }
    }

    function triggerImportJSON() {
      const inp = document.getElementById('import-json-input');
      inp.value = ''; inp.click();
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !parsed.teams || !parsed.matches) { showToast('Invalid JSON file.', '⚠️'); return; }
          state = parsed;
          ensureStateIntegrity();
          saveState(); render(); showToast('Backup imported & synced!', '✅');
        } catch (err) { showToast('Could not read JSON.', '⚠️'); }
      };
      reader.readAsText(file);
    }

    // Expose globals for inline handlers
    Object.assign(window, {
      appSession, uiState, getMatchById,
      openScorerPinModal, switchToTvPreview, lockToTvMode,
      setTvTab, setScorerTab, openCloudRoomModal, copyTvShareLink,
      manualRefreshLive, saveSession,
      openScorecardModal, printMatchScorecard, generateWhatsAppSummary, copyTextToClipboard,
      openMatchInScorer, selectToss, startMatchAfterToss, startSecondInnings, confirmEndInningsEarly,
      setActiveBatter, openRetireHurtModal, swapStrike, setCurrentBowler, recordBall, openWicketPanel, confirmWicketBall,
      undoLastBall, setSuperOverWinner, openMatchWeatherModal, openPlayoffOverrideModal,
      applySquadPreset, openQuickAddPlayerModal, updateTeamName, updatePlayerField, deletePlayer,
      updateSetting, confirmResetMatch, confirmResetTournament, confirmClearDatabase, exportBackupJSON, triggerImportJSON,
      handleImportFile, closeModal, render
    });

    // Boot App
    loadSession();
    loadLocalState();
    render();
    initCloudSync();
  </script>
</body>
</html>
