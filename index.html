<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PE Battle of Brothers 2026 — Live TV Scoreboard & Tournament Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tap-btn:active { transform: scale(0.96); }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .live-dot { animation: pulse-dot 1.3s ease-in-out infinite; }

    /* Print Scorecard Stylesheet (Crisp Black-on-White A4 Portrait) */
    #print-scorecard-container { display: none; }

    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      #app-shell, #modal-overlay, #toast, #clipboard-helper, #import-json-input {
        display: none !important;
      }
      #print-scorecard-container {
        display: block !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: 'Inter', Arial, sans-serif;
        font-size: 10.5px;
        line-height: 1.35;
      }
      .print-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 8px;
      }
      .print-table th, .print-table td {
        border: 1px solid #222222;
        padding: 3px 5px;
        text-align: left;
      }
      .print-table th {
        background-color: #f1f5f9 !important;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 9px;
      }
      .print-num { text-align: right !important; font-variant-numeric: tabular-nums; }
      .print-avoid-break { page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Main Interactive App Shell (Hidden during print) -->
  <div id="app-shell" class="min-h-screen flex flex-col">
    <!-- Dynamic Header (Broadcast Dark Header in TV Mode, Clean Admin Header in Scorer Mode) -->
    <header id="app-header" class="sticky top-0 z-30 shadow-lg"></header>

    <!-- Main Content Container -->
    <main id="app-content" class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-4 py-4 pb-24 sm:pb-10"></main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-nav" class="sm:hidden fixed bottom-0 left-0 right-0 z-30 shadow-2xl"></nav>
  </div>

  <!-- Dedicated Printable Match Scorecard Container (Visible ONLY during @media print) -->
  <div id="print-scorecard-container"></div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-2xl border border-emerald-500/60 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-200 max-w-[92vw]">
    <span id="toast-icon">✅</span>
    <span id="toast-msg" class="truncate">Saved!</span>
  </div>

  <!-- Custom Modal (No browser alert/confirm) -->
  <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-[60] hidden items-center justify-center p-3 sm:p-4">
    <div id="modal-box" class="bg-white text-slate-900 rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-2 mb-3">
        <h3 id="modal-title" class="text-base sm:text-lg font-black text-slate-900 leading-tight">Modal</h3>
        <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition shrink-0" aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="text-sm text-slate-600 mb-5 leading-relaxed"></div>
      <div id="modal-actions" class="flex justify-end gap-2 flex-wrap"></div>
    </div>
  </div>

  <!-- Hidden file input for JSON Backup Import -->
  <input type="file" id="import-json-input" accept=".json,application/json" class="hidden" onchange="handleImportFile(event)" />
  <!-- Hidden textarea for iframe-safe clipboard copy -->
  <textarea id="clipboard-helper" class="fixed -top-96 left-0 opacity-0 pointer-events-none" aria-hidden="true"></textarea>

  <script>
    /*************************************************************************
     * 1. DEDICATED FIREBASE REALTIME DATABASE SYNC & PERSISTENT SESSION
     *    - Hardcoded to: https://pebob2026-default-rtdb.firebaseio.com/
     *    - Default public view is locked TV BROADCAST MODE.
     *    - Scorer PIN unlock persists across page refreshes (until locked).
     *************************************************************************/
    const RTDB_URL = 'https://pebob2026-default-rtdb.firebaseio.com';
    const ROOM_CODE = 'PEBOB2026';
    const RTDB_ENDPOINT = `${RTDB_URL}/tournaments/${ROOM_CODE}.json`;
    const STORAGE_STATE_KEY = 'pebob2026_state';
    const STORAGE_SESSION_KEY = 'pebob2026_session';

    let syncTimer = null;
    let rtdbPollTimer = null;

    const appSession = {
      viewMode: 'tv',          // 'tv' (default public view) | 'scorer' (unlocked admin view)
      scorerUnlocked: false,   // Persists across refresh until scorer clicks Lock
      tvTab: 'live',           // 'live' | 'matches' | 'points' | 'awards'
      scorerTab: 'scorer',     // 'scorer' | 'schedule' | 'points' | 'awards' | 'setup'
      roomCode: ROOM_CODE,
      syncStatus: 'connecting', // 'connecting' | 'live' | 'synced' | 'syncing' | 'offline'
      pinnedTvMatchId: null,
      tvShowInlineScorecard: false,
      lastSyncedAt: 0,
      lastRemoteUpdatedAt: 0,
      lastSyncedTimeStr: '',
      rtdbError: '',
      clientId: 'C_' + Math.random().toString(36).slice(2, 10)
    };

    function saveSession() {
      try {
        localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify({
          viewMode: appSession.viewMode,
          scorerUnlocked: appSession.scorerUnlocked,
          tvTab: appSession.tvTab,
          scorerTab: appSession.scorerTab
        }));
      } catch (e) { /* ignore storage restrictions */ }
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(STORAGE_SESSION_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          appSession.scorerUnlocked = Boolean(parsed.scorerUnlocked);
          appSession.viewMode = (parsed.scorerUnlocked && parsed.viewMode === 'scorer') ? 'scorer' : 'tv';
          if (['live', 'matches', 'points', 'awards'].includes(parsed.tvTab)) appSession.tvTab = parsed.tvTab;
          if (['scorer', 'schedule', 'points', 'awards', 'setup'].includes(parsed.scorerTab)) appSession.scorerTab = parsed.scorerTab;
        }
      } catch (e) { /* ignore storage restrictions */ }
    }

    function formatSyncClock(ts) {
      try {
        return new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    async function fetchFromRtdb(silent = true, forceRender = false) {
      try {
        const res = await fetch(RTDB_ENDPOINT, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        appSession.rtdbError = '';

        if (data && data.stateJson) {
          const remoteUpdatedAt = Number(data.updatedAt || 0);
          const localUpdatedAt = Number(state.updatedAt || 0);

          // Protect scorer from losing newer local balls on refresh
          if (appSession.scorerUnlocked && localUpdatedAt > remoteUpdatedAt) {
            appSession.syncStatus = 'synced';
            updateSyncUI();
            await pushStateToCloudImmediate();
            return true;
          }

          // Skip redundant re-renders when data has not changed
          if (!forceRender && remoteUpdatedAt && remoteUpdatedAt === appSession.lastRemoteUpdatedAt) {
            appSession.syncStatus = appSession.viewMode === 'scorer' ? 'synced' : 'live';
            updateSyncUI();
            return true;
          }

          const remote = typeof data.stateJson === 'string' ? JSON.parse(data.stateJson) : data.stateJson;
          if (remote && remote.teams && remote.matches) {
            state = remote;
            state.updatedAt = remoteUpdatedAt || state.updatedAt || Date.now();
            ensureStateIntegrity();
            try { localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state)); } catch (e) {}
            appSession.lastRemoteUpdatedAt = remoteUpdatedAt;
            appSession.lastSyncedTimeStr = formatSyncClock(remoteUpdatedAt || Date.now());
            appSession.syncStatus = appSession.viewMode === 'scorer' ? 'synced' : 'live';
            render();
            return true;
          }
        } else {
          // Database is empty — if scorer is unlocked, push initial state
          appSession.syncStatus = appSession.viewMode === 'scorer' ? 'synced' : 'live';
          updateSyncUI();
          if (appSession.scorerUnlocked) {
            await pushStateToCloudImmediate();
          }
          return true;
        }
      } catch (err) {
        console.error('RTDB fetch error:', err);
        appSession.rtdbError = 'Cannot reach Firebase database. Check internet or RTDB rules.';
        appSession.syncStatus = 'offline';
        updateSyncUI();
        if (!silent) showToast('Cloud refresh failed — check connection.', '⚠️');
        return false;
      }
      return false;
    }

    async function manualRefreshLive() {
      showToast('Refreshing live score...', '🔄');
      const ok = await fetchFromRtdb(false, true);
      if (ok) showToast('Scoreboard updated!', '🟢');
    }

    async function initCloudSync() {
      appSession.syncStatus = 'connecting';
      updateSyncUI();

      await fetchFromRtdb(true, true);

      if (rtdbPollTimer) clearInterval(rtdbPollTimer);
      rtdbPollTimer = setInterval(() => {
        if (appSession.viewMode === 'tv') {
          fetchFromRtdb(true, false);
        }
      }, 2500);
    }

    function scheduleCloudPush() {
      if (!appSession.scorerUnlocked) return;
      appSession.syncStatus = 'syncing';
      updateSyncUI();
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => pushStateToCloudImmediate(), 220);
    }

    async function pushStateToCloudImmediate() {
      if (!appSession.scorerUnlocked) return;
      const now = Date.now();
      state.updatedAt = now;
      appSession.lastSyncedAt = now;
      try { localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state)); } catch (e) {}

      try {
        const res = await fetch(RTDB_ENDPOINT, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            roomCode: ROOM_CODE,
            updatedAt: now,
            updatedBy: appSession.clientId,
            stateJson: JSON.stringify(state)
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        appSession.rtdbError = '';
        appSession.lastRemoteUpdatedAt = now;
        appSession.lastSyncedTimeStr = formatSyncClock(now);
        appSession.syncStatus = 'synced';
        updateSyncUI();
      } catch (err) {
        console.error('RTDB push failed:', err);
        appSession.rtdbError = 'Write failed — ensure Firebase RTDB rules allow read/write.';
        appSession.syncStatus = 'offline';
        updateSyncUI();
      }
    }

    function updateSyncUI() {
      const dot = document.getElementById('sync-dot');
      const lbl = document.getElementById('sync-label');
      if (!dot || !lbl) return;
      const timeSuffix = appSession.lastSyncedTimeStr ? ` • ${appSession.lastSyncedTimeStr}` : '';
      if (appSession.syncStatus === 'live' || appSession.syncStatus === 'synced') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 live-dot';
        lbl.textContent = `LIVE SYNC${timeSuffix}`;
      } else if (appSession.syncStatus === 'syncing' || appSession.syncStatus === 'connecting') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        lbl.textContent = appSession.syncStatus === 'connecting' ? 'CONNECTING...' : 'SYNCING...';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-orange-400';
        lbl.textContent = 'OFFLINE';
      }
    }

    /*************************************************************************
     * 2. TOURNAMENT DATA MODEL (16 MATCHES: GRP A + GRP B 2x RR + PAGE PLAYOFFS)
     *************************************************************************/

    function createDefaultState() {
      const teams = {
        A1: { id: 'A1', name: 'Team A1', group: 'A' },
        A2: { id: 'A2', name: 'Team A2', group: 'A' },
        A3: { id: 'A3', name: 'Team A3', group: 'A' },
        A4: { id: 'A4', name: 'Team A4', group: 'A' },
        B1: { id: 'B1', name: 'Team B1', group: 'B' },
        B2: { id: 'B2', name: 'Team B2', group: 'B' },
        B3: { id: 'B3', name: 'Team B3', group: 'B' }
      };

      const players = {};
      Object.keys(teams).forEach(tid => {
        for (let i = 1; i <= 6; i++) {
          const pid = `${tid}_B${i}`;
          players[pid] = { id: pid, teamId: tid, name: `${tid} Boy ${i}`, gender: 'boy' };
        }
        for (let g = 1; g <= 2; g++) {
          const pid = `${tid}_G${g}`;
          players[pid] = { id: pid, teamId: tid, name: `${tid} Girl ${g}`, gender: 'girl' };
        }
      });

      const settings = {
        tournamentName: 'PE Battle of Brothers 2026',
        scorerPin: '2004',
        oversPerInnings: 5,
        ballsPerOver: 6,
        girlsOverGroup: true,
        girlsOverPlayoffs: false,
        girlsOverFinal: false,
        bowlerLimitMode: '1_per_bowler' // '1_per_bowler' | 'one_boy_2' | 'any_boy_2'
      };

      const playoffOverride = {
        locked: false,
        A1: null,
        B1: null,
        A2: null,
        B2: null
      };

      const scheduleBlueprint = [
        { id: 'M1',  number: 1,  label: 'Match 1',  stage: 'Group A', time: '08:15 AM', team1Id: 'A1', team2Id: 'A2' },
        { id: 'M2',  number: 2,  label: 'Match 2',  stage: 'Group B', time: '08:45 AM', team1Id: 'B1', team2Id: 'B2', roundNote: 'Round 1' },
        { id: 'M3',  number: 3,  label: 'Match 3',  stage: 'Group A', time: '09:15 AM', team1Id: 'A3', team2Id: 'A4' },
        { id: 'M4',  number: 4,  label: 'Match 4',  stage: 'Group B', time: '09:45 AM', team1Id: 'B2', team2Id: 'B3', roundNote: 'Round 1' },
        { id: 'M5',  number: 5,  label: 'Match 5',  stage: 'Group A', time: '10:15 AM', team1Id: 'A1', team2Id: 'A3' },
        { id: 'M6',  number: 6,  label: 'Match 6',  stage: 'Group B', time: '10:45 AM', team1Id: 'B1', team2Id: 'B3', roundNote: 'Round 1' },
        { id: 'M7',  number: 7,  label: 'Match 7',  stage: 'Group A', time: '11:15 AM', team1Id: 'A2', team2Id: 'A4' },
        { id: 'M8',  number: 8,  label: 'Match 8',  stage: 'Group B', time: '11:45 AM', team1Id: 'B1', team2Id: 'B2', roundNote: 'Round 2' },
        { id: 'M9',  number: 9,  label: 'Match 9',  stage: 'Group A', time: '12:15 PM', team1Id: 'A1', team2Id: 'A4' },
        { id: 'M10', number: 10, label: 'Match 10', stage: 'Group B', time: '01:00 PM', team1Id: 'B2', team2Id: 'B3', roundNote: 'Round 2' },
        { id: 'M11', number: 11, label: 'Match 11', stage: 'Group A', time: '01:30 PM', team1Id: 'A2', team2Id: 'A3' },
        { id: 'M12', number: 12, label: 'Match 12', stage: 'Group B', time: '02:00 PM', team1Id: 'B1', team2Id: 'B3', roundNote: 'Round 2' },
        { id: 'M13', number: 13, label: 'Qualifier 1', stage: 'Playoffs', time: '02:40 PM', team1Id: null, team2Id: null, seed1: 'Group A #1', seed2: 'Group B #1', playoffType: 'Q1' },
        { id: 'M14', number: 14, label: 'Eliminator',  stage: 'Playoffs', time: '03:10 PM', team1Id: null, team2Id: null, seed1: 'Group A #2', seed2: 'Group B #2', playoffType: 'ELIM' },
        { id: 'M15', number: 15, label: 'Qualifier 2', stage: 'Playoffs', time: '03:45 PM', team1Id: null, team2Id: null, seed1: 'Loser Q1',   seed2: 'Winner Elim', playoffType: 'Q2' },
        { id: 'M16', number: 16, label: 'Grand Final', stage: 'Final',    time: '04:20 PM', team1Id: null, team2Id: null, seed1: 'Winner Q1',  seed2: 'Winner Q2',   playoffType: 'FINAL' }
      ];

      const matches = scheduleBlueprint.map(m => ({
        ...m,
        status: 'upcoming',
        customOvers: null,
        customBallsPerOver: null,
        customWickets: null,
        girlsOverOverride: null,
        tossWinnerId: null,
        tossDecision: null,
        currentInnings: 0,
        inningsBreak: false,
        innings: [createEmptyInnings(), createEmptyInnings()],
        result: { winnerId: null, superOverWinnerId: null, summaryText: '' }
      }));

      return {
        version: 4,
        updatedAt: 0,
        teams,
        players,
        settings,
        playoffOverride,
        matches,
        activeMatchId: 'M1'
      };
    }

    function createEmptyInnings() {
      return {
        battingTeamId: null,
        bowlingTeamId: null,
        strikerId: null,
        nonStrikerId: null,
        retiredHurtIds: [],
        overs: [],
        completed: false,
        allOut: false
      };
    }

    let state = createDefaultState();

    function ensureStateIntegrity() {
      if (!state.settings) state.settings = createDefaultState().settings;
      if (!state.settings.scorerPin) state.settings.scorerPin = '2004';
      if (!state.settings.tournamentName) state.settings.tournamentName = 'PE Battle of Brothers 2026';
      if (!state.playoffOverride) state.playoffOverride = { locked: false, A1: null, B1: null, A2: null, B2: null };
    }

    // Transient UI state (local only)
    let uiState = {
      pendingExtra: null,       // null | 'WD' | 'NB' | 'BLB' | 'W'
      wicketOutTarget: 'striker',
      wicketDismissal: 'bowled', // 'bowled' | 'caught' | 'runout' | 'stumped' | 'lbw'
      wicketFielder: '',
      wicketRuns: 0,
      wicketNextBatterId: '',
      summaryInningsTab: 0,
      scheduleFilter: 'ALL',
      setupSelectedTeamId: 'A1',
      leaderboardView: 'batting' // 'batting' | 'bowling' | 'mvp'
    };

    function saveState() {
      state.updatedAt = Date.now();
      try {
        localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state));
      } catch (e) { /* ignore storage restrictions */ }
      scheduleCloudPush();
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.teams && parsed.matches) {
            state = parsed;
            ensureStateIntegrity();
          }
        }
      } catch (e) { /* ignore storage restrictions */ }
    }

    /*************************************************************************
     * 3. SCORER PIN LOCK & NAVIGATION ACTIONS
     *************************************************************************/

    function openScorerPinModal() {
      if (appSession.scorerUnlocked) {
        appSession.viewMode = 'scorer';
        saveSession();
        render();
        return;
      }

      showModal({
        title: '🔒 Unlock Scorer Mode',
        bodyHtml: `
          <div class="space-y-3.5">
            <label for="pin-input-field" class="block text-xs font-bold text-slate-600">Enter Scorer PIN</label>
            <input id="pin-input-field" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" class="w-full text-center tracking-[0.6em] text-2xl font-black bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-emerald-500" />
            <div id="pin-error-msg" class="text-xs font-bold text-rose-600 hidden">Incorrect PIN. Please try again.</div>
          </div>
        `,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700' },
          {
            label: 'Unlock Scorer →',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700',
            onClick: () => verifyScorerPin()
          }
        ]
      });

      setTimeout(() => {
        const el = document.getElementById('pin-input-field');
        if (el) {
          el.focus();
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              if (verifyScorerPin()) closeModal();
            }
          });
        }
      }, 60);
    }

    function verifyScorerPin() {
      const el = document.getElementById('pin-input-field');
      const err = document.getElementById('pin-error-msg');
      const entered = (el ? el.value : '').trim();
      const expected = String(state.settings.scorerPin || '2004').trim();

      if (entered === expected) {
        appSession.scorerUnlocked = true;
        appSession.viewMode = 'scorer';
        saveSession();
        pushStateToCloudImmediate();
        render();
        showToast('Scorer Mode unlocked!', '🔓');
        return true;
      } else {
        if (err) err.classList.remove('hidden');
        if (el) { el.value = ''; el.focus(); }
        return false;
      }
    }

    function switchToTvPreview() {
      appSession.viewMode = 'tv';
      saveSession();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function lockToTvMode() {
      appSession.scorerUnlocked = false;
      appSession.viewMode = 'tv';
      uiState.pendingExtra = null;
      saveSession();
      render();
      showToast('Locked to Public TV Mode', '🔒');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setTvTab(tab) {
      appSession.tvTab = tab;
      saveSession();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setScorerTab(tab) {
      if (!appSession.scorerUnlocked) return;
      appSession.scorerTab = tab;
      uiState.pendingExtra = null;
      saveSession();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCloudRoomModal() {
      const isLiveSynced = appSession.syncStatus === 'live' || appSession.syncStatus === 'synced';

      showModal({
        title: '📡 Live Cloud Sync & TV Link',
        bodyHtml: `
          <div class="space-y-4">
            <div class="bg-slate-900 text-white rounded-xl p-3.5 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Tournament Cloud</div>
                <div class="text-xl font-mono font-black text-emerald-400 tracking-wider">${ROOM_CODE}</div>
                <div class="text-[11px] mt-0.5 ${isLiveSynced ? 'text-emerald-300' : 'text-orange-300'} font-bold">${isLiveSynced ? '🟢 LIVE SYNC ACTIVE' : '🟠 OFFLINE / CHECK CONNECTION'}</div>
              </div>
              <button onclick="copyTvShareLink()" class="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs hover:bg-emerald-400 transition shrink-0">
                📋 Copy TV Link
              </button>
            </div>
            ${appSession.rtdbError ? `<div class="bg-rose-50 border border-rose-200 rounded-xl p-2.5 text-xs font-bold text-rose-700">⚠️ ${escapeHtml(appSession.rtdbError)}</div>` : ''}
            <p class="text-[11px] text-slate-500 leading-relaxed">
              Connected directly to <strong>pebob2026-default-rtdb.firebaseio.com</strong>. Share the link with watchers — they automatically open in locked <strong>TV Broadcast Mode</strong>.
            </p>
          </div>
        `,
        actions: [
          {
            label: '↻ Refresh Now',
            className: 'px-3.5 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white hover:bg-sky-700',
            onClick: () => { manualRefreshLive(); }
          },
          { label: 'Close', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white' }
        ]
      });
    }

    function copyTvShareLink() {
      let shareUrl = '';
      try {
        const url = new URL(window.location.href);
        url.search = '';
        shareUrl = url.toString();
      } catch (e) { shareUrl = ''; }

      const text = shareUrl
        ? `🏏 Watch *${state.settings.tournamentName}* LIVE!\n📺 Live TV Scoreboard: ${shareUrl}`
        : `🏏 Watch *${state.settings.tournamentName}* LIVE!`;
      copyTextToClipboard(text, 'Live TV Link copied!');
    }

    /*************************************************************************
     * 4. RULE HELPERS, STATS ENGINE, NRR & PLAYOFF SEEDING
     *************************************************************************/

    function isGirlsOverEnabledForMatch(m) {
      if (!m) return false;
      if (m.girlsOverOverride !== null && m.girlsOverOverride !== undefined) return Boolean(m.girlsOverOverride);
      if (m.stage === 'Final') return Boolean(state.settings.girlsOverFinal);
      if (m.stage === 'Playoffs') return Boolean(state.settings.girlsOverPlayoffs);
      return Boolean(state.settings.girlsOverGroup);
    }

    function getMatchOvers(m) {
      return (m && m.customOvers) ? Number(m.customOvers) : Number(state.settings.oversPerInnings || 5);
    }

    function getMatchBallsPerOver(m) {
      return (m && m.customBallsPerOver) ? Number(m.customBallsPerOver) : Number(state.settings.ballsPerOver || 6);
    }

    function getBoysWicketsLimit(m, battingTeamId) {
      if (m && m.customWickets) return Number(m.customWickets);
      const boysCount = battingTeamId ? getTeamPlayers(battingTeamId, 'boy').length : 6;
      return Math.max(1, boysCount - 1);
    }

    function getTeamName(teamId, fallback = 'TBD') {
      return (teamId && state.teams[teamId]) ? (state.teams[teamId].name || teamId) : fallback;
    }

    function getPlayer(playerId) {
      return (playerId && state.players[playerId]) ? state.players[playerId] : null;
    }

    function getPlayerName(playerId, fallback = 'Unknown') {
      const p = getPlayer(playerId);
      return p ? p.name : fallback;
    }

    function getTeamPlayers(teamId, genderFilter = null) {
      return Object.values(state.players)
        .filter(p => p.teamId === teamId && (!genderFilter || p.gender === genderFilter))
        .sort((a, b) => {
          if (a.gender !== b.gender) return a.gender === 'boy' ? -1 : 1;
          return a.name.localeCompare(b.name);
        });
    }

    function getMatchById(id) {
      return state.matches.find(m => m.id === id);
    }

    function getMatchWinnerId(m) {
      if (!m || m.status !== 'completed') return null;
      const w = m.result.superOverWinnerId || m.result.winnerId;
      return (w && w !== 'TIE') ? w : null;
    }

    function getMatchLoserId(m) {
      const w = getMatchWinnerId(m);
      if (!w) return null;
      return w === m.team1Id ? m.team2Id : m.team1Id;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRate(val) {
      return (!isFinite(val) || isNaN(val)) ? '0.00' : val.toFixed(2);
    }

    function formatNRR(val) {
      if (!isFinite(val) || isNaN(val)) return '+0.000';
      return (val >= 0 ? '+' : '') + val.toFixed(3);
    }

    function ballsToOversStr(legalBalls, bpo = 6) {
      const base = bpo || 6;
      return `${Math.floor(legalBalls / base)}.${legalBalls % base}`;
    }

    function getBowlerEligibility(inn, player, currentOverIndex, isGirlsOver) {
      const oversByPlayer = {};
      (inn.overs || []).forEach((ov, idx) => {
        if (idx === currentOverIndex) return;
        if (ov.bowlerId) oversByPlayer[ov.bowlerId] = (oversByPlayer[ov.bowlerId] || 0) + 1;
      });
      const alreadyBowled = oversByPlayer[player.id] || 0;

      if (isGirlsOver || player.gender === 'girl') {
        const remaining = Math.max(0, 1 - alreadyBowled);
        return { allowed: remaining > 0, remaining, alreadyBowled, maxForPlayer: 1 };
      }

      const mode = state.settings.bowlerLimitMode || '1_per_bowler';
      if (mode === '1_per_bowler') {
        const remaining = Math.max(0, 1 - alreadyBowled);
        return { allowed: remaining > 0, remaining, alreadyBowled, maxForPlayer: 1 };
      }
      if (mode === 'any_boy_2') {
        const remaining = Math.max(0, 2 - alreadyBowled);
        return { allowed: remaining > 0, remaining, alreadyBowled, maxForPlayer: 2 };
      }
      if (mode === 'one_boy_2') {
        const anotherBoyUsed2 = Object.entries(oversByPlayer).some(([pid, count]) => pid !== player.id && count >= 2);
        const maxForPlayer = anotherBoyUsed2 ? 1 : 2;
        const remaining = Math.max(0, maxForPlayer - alreadyBowled);
        return { allowed: remaining > 0, remaining, alreadyBowled, maxForPlayer };
      }
      return { allowed: alreadyBowled < 1, remaining: Math.max(0, 1 - alreadyBowled), alreadyBowled, maxForPlayer: 1 };
    }

    function computeInningsStats(inn, m = null) {
      const bpo = getMatchBallsPerOver(m);
      const battingMap = {};
      const bowlingMap = {};
      let runs = 0, wickets = 0, extras = 0, widesTotal = 0, nbTotal = 0, byesTotal = 0, lbTotal = 0;
      let completedOvers = 0, legalBallsInCurrent = 0;

      const ensureBatter = (pid) => {
        if (!pid) return null;
        if (!battingMap[pid]) {
          battingMap[pid] = {
            playerId: pid, runs: 0, balls: 0, fours: 0, sixes: 0,
            out: false, retiredHurt: false, dismissalText: 'not out', batted: false
          };
        }
        return battingMap[pid];
      };

      const ensureBowler = (pid) => {
        if (!pid) return null;
        if (!bowlingMap[pid]) {
          bowlingMap[pid] = {
            playerId: pid, legalBalls: 0, completedOvers: 0,
            runsConceded: 0, wickets: 0, wides: 0, noBalls: 0, bpo
          };
        }
        return bowlingMap[pid];
      };

      if (inn.strikerId) { const b = ensureBatter(inn.strikerId); if (b) b.batted = true; }
      if (inn.nonStrikerId) { const b = ensureBatter(inn.nonStrikerId); if (b) b.batted = true; }

      (inn.overs || []).forEach(ov => {
        const ovBowler = ensureBowler(ov.bowlerId);
        let legalInOver = 0;

        (ov.balls || []).forEach(ball => {
          runs += ball.totalRuns;
          if (ball.isWicket) wickets += 1;

          if (ball.extraType) {
            const pen = (ball.extraType === 'WD' || ball.extraType === 'NB')
              ? (ball.extraPenalty !== undefined ? ball.extraPenalty : 1)
              : 0;
            const exVal = pen + (ball.extraRuns || 0);
            extras += exVal;
            if (ball.extraType === 'WD') widesTotal += exVal;
            else if (ball.extraType === 'NB') nbTotal += pen;
            else if (ball.extraType === 'B') byesTotal += (ball.extraRuns || 0);
            else if (ball.extraType === 'LB') lbTotal += (ball.extraRuns || 0);
          }

          const striker = ensureBatter(ball.strikerId);
          if (striker) {
            striker.batted = true;
            striker.runs += (ball.runsBat || 0);
            if (ball.extraType !== 'WD') striker.balls += 1;
            if (ball.runsBat === 4) striker.fours += 1;
            if (ball.runsBat === 6) striker.sixes += 1;
          }
          if (ball.nonStrikerId) {
            const ns = ensureBatter(ball.nonStrikerId);
            if (ns) ns.batted = true;
          }

          const bowler = ensureBowler(ball.bowlerId || ov.bowlerId);
          if (bowler) {
            if (ball.isLegal) { bowler.legalBalls += 1; legalInOver += 1; }
            if (ball.extraType !== 'B' && ball.extraType !== 'LB') bowler.runsConceded += ball.totalRuns;
            if (ball.extraType === 'WD') bowler.wides += 1;
            if (ball.extraType === 'NB') bowler.noBalls += 1;
          }

          if (ball.isWicket && ball.outPlayerId) {
            const outBatter = ensureBatter(ball.outPlayerId);
            const bName = getPlayerName(ball.bowlerId || ov.bowlerId, 'Bowler');
            const fTxt = ball.fielderName ? ` ${ball.fielderName}` : '';
            if (outBatter) {
              outBatter.batted = true;
              outBatter.out = true;
              const d = ball.wicketDismissal || ball.wicketType || 'bowled';
              if (d === 'runout') outBatter.dismissalText = `run out${fTxt ? ` (${ball.fielderName})` : ''}`;
              else if (d === 'caught') outBatter.dismissalText = `c${fTxt || ' Fielder'} b ${bName}`;
              else if (d === 'stumped') outBatter.dismissalText = `st${fTxt || ' WK'} b ${bName}`;
              else if (d === 'lbw') outBatter.dismissalText = `lbw b ${bName}`;
              else outBatter.dismissalText = `b ${bName}`;
            }
            if (bowler && (ball.wicketDismissal || ball.wicketType) !== 'runout') {
              bowler.wickets += 1;
            }
          }
        });

        if (ov.completed) {
          completedOvers += 1;
          if (ovBowler) ovBowler.completedOvers += 1;
        } else {
          legalBallsInCurrent = legalInOver;
        }
      });

      // Mark batters who left the crease without losing their wicket as "retired hurt"
      // (including not-out girls who leave after Over 1 when boys come in to bat)
      const retiredSet = new Set(Array.isArray(inn.retiredHurtIds) ? inn.retiredHurtIds : []);
      Object.values(battingMap).forEach(b => {
        if (!b.out && b.batted) {
          const isAtCrease = (b.playerId === inn.strikerId || b.playerId === inn.nonStrikerId);
          if (retiredSet.has(b.playerId) || !isAtCrease) {
            b.retiredHurt = true;
            b.dismissalText = 'retired hurt';
          }
        }
      });

      const oversDisplay = `${completedOvers}.${legalBallsInCurrent}`;
      const decimalOvers = completedOvers + (legalBallsInCurrent / bpo);
      const totalLegalBalls = completedOvers * bpo + legalBallsInCurrent;

      return {
        runs, wickets, extras, widesTotal, nbTotal, byesTotal, lbTotal,
        completedOvers, legalBallsInCurrent, oversDisplay, decimalOvers,
        totalLegalBalls, bpo, battingMap, bowlingMap
      };
    }

    function getNrrOversForInnings(inn, m) {
      const maxOvers = getMatchOvers(m);
      if (inn.allOut) return maxOvers;
      return Math.min(maxOvers, computeInningsStats(inn, m).decimalOvers);
    }

    function getGroupStandings(groupLetter) {
      const teamIds = Object.values(state.teams).filter(t => t.group === groupLetter).map(t => t.id);
      const stageName = `Group ${groupLetter}`;
      const map = {};
      teamIds.forEach(tid => {
        map[tid] = {
          teamId: tid, name: getTeamName(tid), played: 0, won: 0, lost: 0, tied: 0, pts: 0,
          runsFor: 0, oversFor: 0, runsAgainst: 0, oversAgainst: 0, nrr: 0
        };
      });

      state.matches.filter(m => m.stage === stageName && m.status === 'completed').forEach(m => {
        const inn1 = m.innings[0], inn2 = m.innings[1];
        if (!inn1.battingTeamId || !inn2.battingTeamId) return;
        const t1 = map[inn1.battingTeamId], t2 = map[inn2.battingTeamId];
        if (!t1 || !t2) return;

        const s1 = computeInningsStats(inn1, m), s2 = computeInningsStats(inn2, m);
        const o1 = getNrrOversForInnings(inn1, m), o2 = getNrrOversForInnings(inn2, m);

        t1.played += 1; t2.played += 1;
        t1.runsFor += s1.runs; t1.oversFor += o1; t1.runsAgainst += s2.runs; t1.oversAgainst += o2;
        t2.runsFor += s2.runs; t2.oversFor += o2; t2.runsAgainst += s1.runs; t2.oversAgainst += o1;

        const winner = m.result.superOverWinnerId || m.result.winnerId;
        if (winner === 'TIE' || !winner) {
          t1.tied += 1; t2.tied += 1; t1.pts += 1; t2.pts += 1;
        } else if (winner === t1.teamId) {
          t1.won += 1; t1.pts += 2; t2.lost += 1;
        } else if (winner === t2.teamId) {
          t2.won += 1; t2.pts += 2; t1.lost += 1;
        }
      });

      return Object.values(map).map(r => {
        r.nrr = (r.oversFor > 0 ? r.runsFor / r.oversFor : 0) - (r.oversAgainst > 0 ? r.runsAgainst / r.oversAgainst : 0);
        return r;
      }).sort((a, b) => (b.pts - a.pts) || (Math.abs(b.nrr - a.nrr) > 0.0001 ? b.nrr - a.nrr : 0) || (b.won - a.won) || a.teamId.localeCompare(b.teamId));
    }

    function getPlayoffQualifiers() {
      const groupA = getGroupStandings('A');
      const groupB = getGroupStandings('B');
      const groupADone = state.matches.filter(m => m.stage === 'Group A').every(m => m.status === 'completed');
      const groupBDone = state.matches.filter(m => m.stage === 'Group B').every(m => m.status === 'completed');
      const anyDone = state.matches.filter(m => m.stage.startsWith('Group')).some(m => m.status === 'completed');

      if (state.playoffOverride && state.playoffOverride.locked) {
        return {
          A1: state.playoffOverride.A1, B1: state.playoffOverride.B1,
          A2: state.playoffOverride.A2, B2: state.playoffOverride.B2,
          isConfirmed: Boolean(state.playoffOverride.A1 && state.playoffOverride.B1 && state.playoffOverride.A2 && state.playoffOverride.B2),
          isLocked: true
        };
      }
      return {
        A1: (groupADone || anyDone) && groupA[0] ? groupA[0].teamId : null,
        B1: (groupBDone || anyDone) && groupB[0] ? groupB[0].teamId : null,
        A2: (groupADone || anyDone) && groupA[1] ? groupA[1].teamId : null,
        B2: (groupBDone || anyDone) && groupB[1] ? groupB[1].teamId : null,
        isConfirmed: groupADone && groupBDone,
        isLocked: false
      };
    }

    function syncPlayoffSeeding() {
      const q = getPlayoffQualifiers();
      const q1 = getMatchById('M13'), elim = getMatchById('M14'), q2 = getMatchById('M15'), fin = getMatchById('M16');

      if (q1 && q1.status === 'upcoming') { q1.team1Id = q.A1 || null; q1.team2Id = q.B1 || null; q1.isProvisional = !q.isConfirmed; }
      if (elim && elim.status === 'upcoming') { elim.team1Id = q.A2 || null; elim.team2Id = q.B2 || null; elim.isProvisional = !q.isConfirmed; }
      if (q2 && q2.status === 'upcoming') { q2.team1Id = getMatchLoserId(q1); q2.team2Id = getMatchWinnerId(elim); q2.isProvisional = !(q2.team1Id && q2.team2Id); }
      if (fin && fin.status === 'upcoming') { fin.team1Id = getMatchWinnerId(q1); fin.team2Id = getMatchWinnerId(q2); fin.isProvisional = !(fin.team1Id && fin.team2Id); }
    }

    function computeTournamentPlayerStats() {
      const agg = {};
      Object.values(state.players).forEach(p => {
        agg[p.id] = {
          playerId: p.id, name: p.name, teamId: p.teamId, teamName: getTeamName(p.teamId), gender: p.gender,
          batInns: 0, runs: 0, ballsFaced: 0, fours: 0, sixes: 0, outs: 0,
          bowlInns: 0, oversBowledDec: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0,
          strikeRate: 0, economy: 0, mvpPoints: 0
        };
      });

      state.matches.filter(m => m.status === 'live' || m.status === 'completed').forEach(m => {
        const bpo = getMatchBallsPerOver(m);
        m.innings.forEach(inn => {
          if (!inn.overs || inn.overs.length === 0) return;
          const st = computeInningsStats(inn, m);
          Object.values(st.battingMap).forEach(b => {
            if (!agg[b.playerId]) return;
            if (b.balls > 0 || b.out || b.runs > 0) {
              agg[b.playerId].batInns += 1;
              agg[b.playerId].runs += b.runs;
              agg[b.playerId].ballsFaced += b.balls;
              agg[b.playerId].fours += b.fours;
              agg[b.playerId].sixes += b.sixes;
              if (b.out) agg[b.playerId].outs += 1;
            }
          });
          Object.values(st.bowlingMap).forEach(bw => {
            if (!agg[bw.playerId]) return;
            if (bw.legalBalls > 0 || bw.runsConceded > 0 || bw.wickets > 0) {
              agg[bw.playerId].bowlInns += 1;
              agg[bw.playerId].legalBallsBowled += bw.legalBalls;
              agg[bw.playerId].oversBowledDec += (bw.legalBalls / bpo);
              agg[bw.playerId].runsConceded += bw.runsConceded;
              agg[bw.playerId].wickets += bw.wickets;
            }
          });
        });
      });

      const list = Object.values(agg).map(p => {
        p.strikeRate = p.ballsFaced > 0 ? (p.runs / p.ballsFaced) * 100 : 0;
        p.economy = p.oversBowledDec > 0 ? (p.runsConceded / p.oversBowledDec) : (p.runsConceded > 0 ? 99.99 : 0);
        p.mvpPoints = (p.runs * 1) + (p.wickets * 20) + (p.fours * 2) + (p.sixes * 4);
        return p;
      });

      const battingList = list.filter(p => p.batInns > 0).sort((a, b) => (b.runs - a.runs) || (b.strikeRate - a.strikeRate));
      const bowlingList = list.filter(p => p.bowlInns > 0).sort((a, b) => (b.wickets - a.wickets) || (a.economy - b.economy));
      const mvpList = list.filter(p => p.mvpPoints > 0).sort((a, b) => (b.mvpPoints - a.mvpPoints) || (b.wickets - a.wickets) || (b.runs - a.runs));

      return {
        battingList, bowlingList, mvpList,
        bestBatsman: battingList[0] || null,
        bestBowler: bowlingList[0] || null,
        bestAllRounder: mvpList[0] || null
      };
    }

    /*************************************************************************
     * 5. SCORING ENGINE (GIRLS ONLY BAT IN OV 1; BOYS ONLY BAT IN OVS 2-5)
     *************************************************************************/

    function createOverObj(m, overNumber) {
      return {
        overNumber,
        bowlerId: null,
        isGirlsOver: (overNumber === 1) && isGirlsOverEnabledForMatch(m),
        balls: [],
        completed: false
      };
    }

    function autoPickDefaultBatters(inn, m = null) {
      const girlsFirst = m && isGirlsOverEnabledForMatch(m);
      if (girlsFirst) {
        const girls = getTeamPlayers(inn.battingTeamId, 'girl');
        if (girls.length >= 1) inn.strikerId = girls[0].id;
        if (girls.length >= 2) inn.nonStrikerId = girls[1].id;
        if (inn.strikerId) return;
      }
      const boys = getTeamPlayers(inn.battingTeamId, 'boy');
      const roster = boys.length >= 2 ? boys : getTeamPlayers(inn.battingTeamId);
      if (roster.length >= 1) inn.strikerId = roster[0].id;
      if (roster.length >= 2) inn.nonStrikerId = roster[1].id;
    }

    // Boys-only batting from Over 2 onward: girls leave the crease and never face boys' bowling
    function autoSwitchToBoysBatters(inn, stats) {
      const dismissedIds = new Set(Object.values(stats.battingMap).filter(b => b.out).map(b => b.playerId));
      const availableBoys = getTeamPlayers(inn.battingTeamId, 'boy').filter(p => !dismissedIds.has(p.id));
      const pool = availableBoys.length > 0 ? availableBoys : getTeamPlayers(inn.battingTeamId).filter(p => !dismissedIds.has(p.id));

      inn.strikerId = pool.length >= 1 ? pool[0].id : null;
      inn.nonStrikerId = pool.length >= 2 ? pool[1].id : null;
    }

    function selectToss(matchId, field, value) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m) return;
      if (field === 'winner') m.tossWinnerId = value;
      else m.tossDecision = value;
      saveState();
      render();
    }

    function startMatchAfterToss(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || !m.tossWinnerId || !m.tossDecision || !m.team1Id || !m.team2Id) return;

      const other = m.tossWinnerId === m.team1Id ? m.team2Id : m.team1Id;
      const batFirst = m.tossDecision === 'bat' ? m.tossWinnerId : other;
      const bowlFirst = batFirst === m.team1Id ? m.team2Id : m.team1Id;

      m.status = 'live';
      m.currentInnings = 1;
      m.inningsBreak = false;

      m.innings[0] = createEmptyInnings();
      m.innings[0].battingTeamId = batFirst;
      m.innings[0].bowlingTeamId = bowlFirst;
      autoPickDefaultBatters(m.innings[0], m);
      m.innings[0].overs.push(createOverObj(m, 1));

      m.innings[1] = createEmptyInnings();
      m.innings[1].battingTeamId = bowlFirst;
      m.innings[1].bowlingTeamId = batFirst;

      state.activeMatchId = m.id;
      uiState.pendingExtra = null;
      saveState();
      render();
      showToast(`${getTeamName(batFirst)} batting first! Select Over 1 bowler.`, '🏏');
    }

    function startSecondInnings(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m) return;
      m.currentInnings = 2;
      m.inningsBreak = false;
      const inn2 = m.innings[1];
      if (!inn2.strikerId) autoPickDefaultBatters(inn2, m);
      if (inn2.overs.length === 0) inn2.overs.push(createOverObj(m, 1));
      uiState.pendingExtra = null;
      saveState();
      render();
      showToast(`2nd Innings started! Target: ${computeInningsStats(m.innings[0], m).runs + 1}`, '🎯');
    }

    function confirmEndInningsEarly(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.status !== 'live' || m.inningsBreak) return;
      const innNum = m.currentInnings;
      showModal({
        title: `End ${innNum === 1 ? '1st' : '2nd'} Innings Early?`,
        bodyHtml: innNum === 1
          ? `Close the 1st innings now and proceed to the Innings Break?`
          : `Close the 2nd innings now and finalize the match result?`,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700' },
          {
            label: 'End Innings',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-amber-600 text-white hover:bg-amber-700',
            onClick: () => {
              const inn = m.innings[innNum - 1];
              inn.completed = true;
              if (innNum === 1) {
                m.inningsBreak = true;
              } else {
                finalizeMatch(m);
              }
              syncPlayoffSeeding();
              saveState();
              render();
              showToast(`${innNum === 1 ? '1st' : '2nd'} Innings ended.`, '🏁');
            }
          }
        ]
      });
    }

    function setActiveBatter(matchId, role, playerId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.currentInnings === 0) return;
      const inn = m.innings[m.currentInnings - 1];
      if (!Array.isArray(inn.retiredHurtIds)) inn.retiredHurtIds = [];

      const outgoingId = role === 'striker' ? inn.strikerId : inn.nonStrikerId;
      const otherEndId = role === 'striker' ? inn.nonStrikerId : inn.strikerId;

      if (role === 'striker') {
        if (playerId === inn.nonStrikerId) inn.nonStrikerId = inn.strikerId;
        inn.strikerId = playerId || null;
      } else {
        if (playerId === inn.strikerId) inn.strikerId = inn.nonStrikerId;
        inn.nonStrikerId = playerId || null;
      }

      // If outgoing batter left the crease (not just a strike swap) and already batted, mark retired hurt
      if (outgoingId && playerId !== otherEndId && outgoingId !== playerId) {
        const hasBattedBall = (inn.overs || []).some(ov =>
          (ov.balls || []).some(b => b.strikerId === outgoingId || b.nonStrikerId === outgoingId)
        );
        if (hasBattedBall && !inn.retiredHurtIds.includes(outgoingId)) {
          inn.retiredHurtIds.push(outgoingId);
          showToast(`${getPlayerName(outgoingId)} marked retired hurt`, '🩹');
        }
      }

      // If a retired-hurt batter returns to the crease, clear their retired hurt status
      if (playerId) {
        inn.retiredHurtIds = inn.retiredHurtIds.filter(id => id !== playerId);
      }

      saveState();
      render();
    }

    function openRetireHurtModal(matchId, role) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.currentInnings === 0) return;
      const inn = m.innings[m.currentInnings - 1];
      const outgoingId = role === 'striker' ? inn.strikerId : inn.nonStrikerId;
      if (!outgoingId) return;

      const stats = computeInningsStats(inn, m);
      const curOver = inn.overs[inn.overs.length - 1];
      const isGirls = Boolean(curOver && curOver.isGirlsOver);
      const dismissedIds = new Set(Object.values(stats.battingMap).filter(b => b.out).map(b => b.playerId));
      const pool = getTeamPlayers(inn.battingTeamId, isGirls ? 'girl' : 'boy')
        .filter(p => !dismissedIds.has(p.id) && p.id !== inn.strikerId && p.id !== inn.nonStrikerId);
      const fallbackPool = pool.length > 0 ? pool : getTeamPlayers(inn.battingTeamId)
        .filter(p => !dismissedIds.has(p.id) && p.id !== inn.strikerId && p.id !== inn.nonStrikerId);

      showModal({
        title: `🩹 Retire Hurt — ${getPlayerName(outgoingId)}`,
        bodyHtml: `
          <div class="space-y-3">
            <p class="text-xs text-slate-600">
              <strong>${escapeHtml(getPlayerName(outgoingId))}</strong> will leave the crease as <strong>retired hurt</strong> (no wicket lost, no ball bowled).
            </p>
            <div>
              <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Replacement Batter</label>
              <select id="retire-next-batter" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold">
                ${fallbackPool.length === 0
                  ? `<option value="">— No replacement (bat solo) —</option>`
                  : fallbackPool.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('') + `<option value="">— None (bat solo) —</option>`
                }
              </select>
            </div>
          </div>
        `,
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700' },
          {
            label: 'Confirm Retired Hurt',
            className: 'px-4 py-2 rounded-xl text-xs font-bold bg-amber-600 text-white hover:bg-amber-700',
            onClick: () => {
              const sel = document.getElementById('retire-next-batter');
              const nextId = sel ? sel.value : '';
              if (!Array.isArray(inn.retiredHurtIds)) inn.retiredHurtIds = [];
              if (!inn.retiredHurtIds.includes(outgoingId)) inn.retiredHurtIds.push(outgoingId);
              if (nextId) inn.retiredHurtIds = inn.retiredHurtIds.filter(id => id !== nextId);

              if (role === 'striker') inn.strikerId = nextId || null;
              else inn.nonStrikerId = nextId || null;

              if (!inn.strikerId && inn.nonStrikerId) {
                inn.strikerId = inn.nonStrikerId;
                inn.nonStrikerId = null;
              }
              saveState();
              render();
              showToast(`${getPlayerName(outgoingId)} retired hurt`, '🩹');
            }
          }
        ]
      });
    }

    function swapStrike(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.currentInnings === 0) return;
      const inn = m.innings[m.currentInnings - 1];
      const tmp = inn.strikerId;
      inn.strikerId = inn.nonStrikerId;
      inn.nonStrikerId = tmp;
      saveState();
      render();
      showToast('Strike swapped', '🔄');
    }

    function setCurrentBowler(matchId, playerId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.currentInnings === 0) return;
      const inn = m.innings[m.currentInnings - 1];
      if (!inn.overs.length) return;
      const curOver = inn.overs[inn.overs.length - 1];
      curOver.bowlerId = playerId || null;
      if (curOver.balls.length > 0 && playerId) curOver.balls.forEach(b => { b.bowlerId = playerId; });
      saveState();
      render();
    }

    function recordBall({ runsBat = 0, extraType = null, extraRuns = 0, isWicket = false, outPlayerId = null, wicketDismissal = 'bowled', fielderName = '', nextBatterId = null }) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(state.activeMatchId);
      if (!m || m.status !== 'live' || m.inningsBreak) return;

      const inn = m.innings[m.currentInnings - 1];
      if (!inn || inn.completed) return;

      if (inn.overs.length === 0) inn.overs.push(createOverObj(m, 1));
      let currentOver = inn.overs[inn.overs.length - 1];
      if (currentOver.completed) {
        currentOver = createOverObj(m, inn.overs.length + 1);
        inn.overs.push(currentOver);
      }

      if (!inn.strikerId) { showToast('Select a Striker first!', '⚠️'); return; }
      if (!currentOver.bowlerId) { showToast(`Select Bowler for Over ${currentOver.overNumber}!`, '⚠️'); return; }

      const bpo = getMatchBallsPerOver(m);
      const maxOvers = getMatchOvers(m);
      const boysWicketLimit = getBoysWicketsLimit(m, inn.battingTeamId);
      const isGirls = Boolean(currentOver.isGirlsOver);

      // STRICT 6-BALL GIRL'S OVER: WD/NB = 2 runs & counts as 1 legal ball (NO re-bowl)
      let extraPenalty = 0;
      let isLegal = true;
      if (extraType === 'WD' || extraType === 'NB') {
        if (isGirls) {
          extraPenalty = 2;
          isLegal = true;
        } else {
          extraPenalty = 1;
          isLegal = false;
        }
      }

      const totalRuns = extraPenalty + runsBat + extraRuns;
      let label = String(runsBat);
      if (extraType === 'WD') {
        label = isGirls ? (extraRuns > 0 ? `WD2+${extraRuns}` : 'WD(2)') : (extraRuns > 0 ? `WD+${extraRuns}` : 'WD');
        if (isWicket) label += '+W';
      } else if (extraType === 'NB') {
        label = isGirls ? (runsBat > 0 ? `NB2+${runsBat}` : 'NB(2)') : (runsBat > 0 ? `NB+${runsBat}` : 'NB');
        if (isWicket) label += '+W';
      } else if (extraType === 'B') {
        label = `B${extraRuns}` + (isWicket ? '+W' : '');
      } else if (extraType === 'LB') {
        label = `LB${extraRuns}` + (isWicket ? '+W' : '');
      } else if (isWicket) {
        label = runsBat > 0 ? `W+${runsBat}` : 'W';
      } else if (runsBat === 0) {
        label = '•';
      }

      const prevStrikerId = inn.strikerId;
      const prevNonStrikerId = inn.nonStrikerId;

      currentOver.balls.push({
        strikerId: inn.strikerId,
        nonStrikerId: inn.nonStrikerId,
        bowlerId: currentOver.bowlerId,
        prevStrikerId,
        prevNonStrikerId,
        runsBat,
        extraType,
        extraPenalty,
        extraRuns,
        totalRuns,
        isWicket,
        outPlayerId: isWicket ? (outPlayerId || inn.strikerId) : null,
        wicketDismissal: isWicket ? wicketDismissal : null,
        fielderName: isWicket ? (fielderName || '').trim() : '',
        isLegal,
        label
      });

      const runsCrossed = (extraType === 'WD' || extraType === 'B' || extraType === 'LB') ? extraRuns : runsBat;
      if (runsCrossed % 2 === 1 && inn.strikerId && inn.nonStrikerId) {
        const tmp = inn.strikerId;
        inn.strikerId = inn.nonStrikerId;
        inn.nonStrikerId = tmp;
      }

      if (isWicket) {
        const dismissedId = outPlayerId || prevStrikerId;
        if (inn.strikerId === dismissedId) inn.strikerId = nextBatterId || null;
        else if (inn.nonStrikerId === dismissedId) inn.nonStrikerId = nextBatterId || null;

        if (nextBatterId && Array.isArray(inn.retiredHurtIds)) {
          inn.retiredHurtIds = inn.retiredHurtIds.filter(id => id !== nextBatterId);
        }

        // Keep last remaining batter on strike if non-striker is still in and striker slot became empty
        if (!inn.strikerId && inn.nonStrikerId) {
          inn.strikerId = inn.nonStrikerId;
          inn.nonStrikerId = null;
        }
      }

      uiState.pendingExtra = null;

      const preOverStats = computeInningsStats(inn, m);
      const legalCount = currentOver.balls.filter(b => b.isLegal).length;

      // GIRL'S OVER RULE: If both batting girls are out (0 girls remaining or 2 girls dismissed), over ends immediately!
      let girlsOverEndedByWickets = false;
      if (isGirls && isWicket) {
        const teamGirls = getTeamPlayers(inn.battingTeamId, 'girl');
        const dismissedGirls = teamGirls.filter(g => preOverStats.battingMap[g.id] && preOverStats.battingMap[g.id].out).length;
        const remainingGirls = teamGirls.length - dismissedGirls;
        if (dismissedGirls >= 2 || remainingGirls <= 0) {
          currentOver.completed = true;
          girlsOverEndedByWickets = true;
        }
      }

      if (!currentOver.completed && legalCount >= bpo) {
        currentOver.completed = true;
        if (inn.strikerId && inn.nonStrikerId) {
          const tmp = inn.strikerId;
          inn.strikerId = inn.nonStrikerId;
          inn.nonStrikerId = tmp;
        }
      }

      const stats = computeInningsStats(inn, m);

      // ALL-OUT RULE: Girls never face boys' bowling, so during Boys' Overs the team is All Out once boysWicketLimit boys are dismissed
      const teamBoys = getTeamPlayers(inn.battingTeamId, 'boy');
      const dismissedBoys = teamBoys.filter(b => stats.battingMap[b.id] && stats.battingMap[b.id].out).length;
      const isAllOutNow = !isGirls && (
        m.customWickets
          ? stats.wickets >= Number(m.customWickets)
          : dismissedBoys >= boysWicketLimit
      );

      if (isAllOutNow) {
        inn.allOut = true;
        inn.completed = true;
      } else if (stats.completedOvers >= maxOvers) {
        inn.completed = true;
      }

      // GIRL'S OVER -> BOY'S OVER TRANSITION: Girls always leave the crease after Over 1; Boys bat from Over 2 onward
      if (currentOver.completed && isGirls && !inn.completed) {
        autoSwitchToBoysBatters(inn, stats);
      }

      if (m.currentInnings === 2) {
        const s1 = computeInningsStats(m.innings[0], m);
        if (stats.runs >= s1.runs + 1 || inn.completed) {
          inn.completed = true;
          finalizeMatch(m);
        } else if (currentOver.completed && inn.overs.length < maxOvers) {
          inn.overs.push(createOverObj(m, inn.overs.length + 1));
          showToast(girlsOverEndedByWickets
            ? `Both girls out — Girl's Over ended! Boys batting for Over 2.`
            : (isGirls ? `Girl's Over complete! Boys batting for Over 2.` : `Over ${currentOver.overNumber} complete! Pick next bowler.`), '⚾');
        }
      } else {
        if (inn.completed) {
          m.inningsBreak = true;
          showToast(`1st Innings complete! Target: ${stats.runs + 1}`, '🏏');
        } else if (currentOver.completed && inn.overs.length < maxOvers) {
          inn.overs.push(createOverObj(m, inn.overs.length + 1));
          showToast(girlsOverEndedByWickets
            ? `Both girls out — Girl's Over ended! Boys batting for Over 2.`
            : (isGirls ? `Girl's Over complete! Boys batting for Over 2.` : `Over ${currentOver.overNumber} complete! Pick next bowler.`), '⚾');
        }
      }

      syncPlayoffSeeding();
      saveState();
      render();
    }

    function finalizeMatch(m) {
      const inn1 = m.innings[0], inn2 = m.innings[1];
      const s1 = computeInningsStats(inn1, m), s2 = computeInningsStats(inn2, m);
      const maxOvers = getMatchOvers(m), bpo = getMatchBallsPerOver(m);
      const teamBoys2 = getTeamPlayers(inn2.battingTeamId, 'boy');
      const dismissedBoys2 = teamBoys2.filter(b => s2.battingMap[b.id] && s2.battingMap[b.id].out).length;
      const boysWktsLimit2 = getBoysWicketsLimit(m, inn2.battingTeamId);

      m.status = 'completed';
      m.inningsBreak = false;

      if (s2.runs > s1.runs) {
        const wktsLeft = Math.max(1, boysWktsLimit2 - dismissedBoys2);
        const ballsLeft = Math.max(0, maxOvers * bpo - s2.totalLegalBalls);
        m.result = {
          winnerId: inn2.battingTeamId,
          superOverWinnerId: null,
          summaryText: `${getTeamName(inn2.battingTeamId)} won by ${wktsLeft} wkt${wktsLeft === 1 ? '' : 's'} (${ballsLeft} ball${ballsLeft === 1 ? '' : 's'} left)`
        };
      } else if (s1.runs > s2.runs) {
        const margin = s1.runs - s2.runs;
        m.result = {
          winnerId: inn1.battingTeamId,
          superOverWinnerId: null,
          summaryText: `${getTeamName(inn1.battingTeamId)} won by ${margin} run${margin === 1 ? '' : 's'}`
        };
      } else {
        m.result = {
          winnerId: 'TIE',
          superOverWinnerId: null,
          summaryText: `Match Tied (${s1.runs}/${s1.wickets} vs ${s2.runs}/${s2.wickets})`
        };
      }
      showToast('Match Completed!', '🏆');
    }

    function setSuperOverWinner(matchId, winnerTeamId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.result.winnerId !== 'TIE') return;
      m.result.superOverWinnerId = winnerTeamId;
      if (winnerTeamId) {
        m.result.summaryText = `Match Tied — ${getTeamName(winnerTeamId)} won via Super Over`;
      } else {
        const s1 = computeInningsStats(m.innings[0], m), s2 = computeInningsStats(m.innings[1], m);
        m.result.summaryText = `Match Tied (${s1.runs}/${s1.wickets} vs ${s2.runs}/${s2.wickets})`;
      }
      syncPlayoffSeeding();
      saveState();
      render();
      showToast(winnerTeamId ? `Super Over winner: ${getTeamName(winnerTeamId)}` : 'Reverted to Tie', '⚡');
    }

    function undoLastBall(matchId) {
      if (!appSession.scorerUnlocked) return;
      const m = getMatchById(matchId);
      if (!m || m.currentInnings === 0) return;

      if (m.status === 'completed') {
        m.status = 'live';
        m.currentInnings = 2;
        m.result = { winnerId: null, superOverWinnerId: null, summaryText: '' };
      }
      if (m.inningsBreak) {
        m.inningsBreak = false;
        m.currentInnings = 1;
      }

      const inn = m.innings[m.currentInnings - 1];
      const totalBalls = inn.overs.reduce((sum, o) => sum + o.balls.length, 0);

      if (totalBalls === 0) {
        if (m.currentInnings === 2) {
          inn.overs = [];
          m.currentInnings = 1;
          m.inningsBreak = true;
          saveState();
          render();
          showToast('Returned to Innings Break', '↩️');
          return;
        }
        showToast('No balls to undo yet.', 'ℹ️');
        return;
      }

      while (inn.overs.length > 0 && inn.overs[inn.overs.length - 1].balls.length === 0) inn.overs.pop();
      const lastOver = inn.overs[inn.overs.length - 1];
      if (!lastOver || lastOver.balls.length === 0) return;

      const popped = lastOver.balls.pop();
      lastOver.completed = false;
      inn.completed = false;
      inn.allOut = false;

      if (popped.prevStrikerId) inn.strikerId = popped.prevStrikerId;
      inn.nonStrikerId = popped.prevNonStrikerId || null;

      syncPlayoffSeeding();
      saveState();
      render();
      showToast(`Undid last delivery (${popped.label})`, '↩️');
    }

     * 6. PRINTABLE A4 MATCH SCORECARD & INTERACTIVE SCORECARD MODAL

    function printMatchScorecard(matchId) {
      const m = getMatchById(matchId);
      if (!m) return;
      const inn1 = m.innings[0], inn2 = m.innings[1];
      const s1 = computeInningsStats(inn1, m), s2 = computeInningsStats(inn2, m);
      const maxOvers = getMatchOvers(m), bpo = getMatchBallsPerOver(m);
      const girlsOn = isGirlsOverEnabledForMatch(m);
      const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

      const tossText = (m.tossWinnerId && m.tossDecision)
        ? `${getTeamName(m.tossWinnerId)} won the toss and elected to ${m.tossDecision} first`
        : 'Toss not recorded';

      const buildInningsPrintBlock = (inn, st, numLabel) => {
        if (!inn || !inn.battingTeamId) {
          return `<div style="margin-bottom:10px; padding:6px; border:1px solid #ccc; font-style:italic;">${numLabel}: Not started</div>`;
        }
        const batters = Object.values(st.battingMap).filter(b => b.batted);
        const bowlers = Object.values(st.bowlingMap);

        const batRows = batters.length === 0
          ? `<tr><td colspan="7" style="text-align:center;color:#666;">No batting records</td></tr>`
          : batters.map(b => {
              const sr = b.balls > 0 ? ((b.runs / b.balls) * 100).toFixed(1) : '0.0';
              return `
                <tr>
                  <td style="font-weight:700;">${escapeHtml(getPlayerName(b.playerId))}${!b.out && !b.retiredHurt ? ' *' : ''}</td>
                  <td>${escapeHtml(b.dismissalText)}</td>
                  <td class="print-num" style="font-weight:700;">${b.runs}</td>
                  <td class="print-num">${b.balls}</td>
                  <td class="print-num">${b.fours}</td>
                  <td class="print-num">${b.sixes}</td>
                  <td class="print-num">${sr}</td>
                </tr>
              `;
            }).join('');

        const bowlRows = bowlers.length === 0
          ? `<tr><td colspan="6" style="text-align:center;color:#666;">No bowling records</td></tr>`
          : bowlers.map(bw => {
              const ovDec = bw.legalBalls / bpo;
              const econ = ovDec > 0 ? (bw.runsConceded / ovDec).toFixed(2) : '0.00';
              return `
                <tr>
                  <td style="font-weight:700;">${escapeHtml(getPlayerName(bw.playerId))}</td>
                  <td class="print-num">${ballsToOversStr(bw.legalBalls, bpo)}</td>
                  <td class="print-num">${bw.runsConceded}</td>
                  <td class="print-num" style="font-weight:700;">${bw.wickets}</td>
                  <td class="print-num">${bw.wides}w / ${bw.noBalls}nb</td>
                  <td class="print-num">${econ}</td>
                </tr>
              `;
            }).join('');

        return `
          <div class="print-avoid-break" style="margin-bottom: 12px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; border-bottom: 2px solid #000; padding-bottom: 2px; margin-bottom: 5px;">
              <span style="font-weight:800; font-size:12px; text-transform:uppercase;">${numLabel}: ${escapeHtml(getTeamName(inn.battingTeamId))}</span>
              <span style="font-weight:800; font-size:13px;">${st.runs}/${st.wickets} <span style="font-weight:600; font-size:10.5px;">(${st.oversDisplay}/${maxOvers} ov)</span></span>
            </div>

            <table class="print-table">
              <thead>
                <tr>
                  <th style="width:28%;">Batter</th>
                  <th style="width:32%;">Dismissal</th>
                  <th class="print-num" style="width:8%;">R</th>
                  <th class="print-num" style="width:8%;">B</th>
                  <th class="print-num" style="width:7%;">4s</th>
                  <th class="print-num" style="width:7%;">6s</th>
                  <th class="print-num" style="width:10%;">SR</th>
                </tr>
              </thead>
              <tbody>
                ${batRows}
                <tr style="background:#f8fafc;">
                  <td colspan="2" style="font-weight:700;">Extras (WD ${st.widesTotal}, NB ${st.nbTotal}, B ${st.byesTotal}, LB ${st.lbTotal})</td>
                  <td class="print-num" style="font-weight:700;">${st.extras}</td>
                  <td colspan="4" style="font-weight:800; text-align:right;">TOTAL: ${st.runs}/${st.wickets} (${st.oversDisplay} ov)</td>
                </tr>
              </tbody>
            </table>

            <table class="print-table">
              <thead>
                <tr>
                  <th style="width:36%;">Bowler (${escapeHtml(getTeamName(inn.bowlingTeamId))})</th>
                  <th class="print-num" style="width:12%;">Overs</th>
                  <th class="print-num" style="width:12%;">Runs</th>
                  <th class="print-num" style="width:12%;">Wkts</th>
                  <th class="print-num" style="width:16%;">Extras</th>
                  <th class="print-num" style="width:12%;">Econ</th>
                </tr>
              </thead>
              <tbody>${bowlRows}</tbody>
            </table>
          </div>
        `;
      };

      const container = document.getElementById('print-scorecard-container');
      container.innerHTML = `
        <div style="border-bottom: 2.5px solid #000; padding-bottom: 6px; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:flex-end;">
          <div>
            <div style="font-size:16px; font-weight:900; text-transform:uppercase; letter-spacing:0.3px;">${escapeHtml(state.settings.tournamentName)}</div>
            <div style="font-size:11px; font-weight:700; margin-top:2px;">OFFICIAL MATCH SCORECARD — ${escapeHtml(m.label)} (${escapeHtml(m.stage)}${m.roundNote ? ` • ${m.roundNote}` : ''})</div>
          </div>
          <div style="text-align:right; font-size:10px;">
            <div><strong>Date:</strong> ${todayStr}</div>
            <div><strong>Room:</strong> ${escapeHtml(appSession.roomCode)}</div>
          </div>
        </div>

        <div style="border:1.5px solid #000; padding:6px 8px; margin-bottom:10px; background:#f8fafc;">
          <div style="font-size:13px; font-weight:900; text-align:center;">
            ${escapeHtml(getTeamName(m.team1Id, m.seed1 || 'TBD'))} vs ${escapeHtml(getTeamName(m.team2Id, m.seed2 || 'TBD'))}
          </div>
          <div style="font-size:10px; text-align:center; margin-top:3px;"><strong>Toss:</strong> ${escapeHtml(tossText)}</div>
          <div style="font-size:11.5px; font-weight:800; text-align:center; margin-top:4px; padding-top:4px; border-top:1px solid #cbd5e1;">
            RESULT: ${escapeHtml(m.result.summaryText || (m.status === 'live' ? 'Match In Progress' : 'Upcoming'))}
          </div>
        </div>

    function generateWhatsAppSummary(m) {
      const inn1 = m.innings[0], inn2 = m.innings[1];
      const s1 = computeInningsStats(inn1, m), s2 = computeInningsStats(inn2, m);
      const maxOvers = getMatchOvers(m), bpo = getMatchBallsPerOver(m);
      const topBat = (st) => {
        const arr = Object.values(st.battingMap).filter(b => b.balls > 0 || b.runs > 0).sort((a, b) => b.runs - a.runs);
        return arr[0] ? `${getPlayerName(arr[0].playerId)} ${arr[0].runs}(${arr[0].balls})` : '-';
      };
      const topBowl = (st) => {
        const arr = Object.values(st.bowlingMap).filter(b => b.legalBalls > 0 || b.wickets > 0).sort((a, b) => b.wickets - a.wickets || a.runsConceded - b.runsConceded);
        return arr[0] ? `${getPlayerName(arr[0].playerId)} ${arr[0].wickets}/${arr[0].runsConceded}` : '-';
      };
      return [
        `🏏 *${state.settings.tournamentName.toUpperCase()}*`,
        `📌 *${m.label}* (${m.stage} • ${isGirlsOverEnabledForMatch(m) ? `Ov1 Girl's ${bpo}b` : `Boys Only ${bpo}b`})`,
        `──────────────────`,
        `1st Inn: *${getTeamName(inn1.battingTeamId)}* — *${s1.runs}/${s1.wickets}* (${s1.oversDisplay}/${maxOvers} ov)`,
        `   Bat: ${topBat(s1)} | Bowl: ${topBowl(s1)}`,
        `2nd Inn: *${getTeamName(inn2.battingTeamId)}* — *${s2.runs}/${s2.wickets}* (${s2.oversDisplay}/${maxOvers} ov)`,
        `   Bat: ${topBat(s2)} | Bowl: ${topBowl(s2)}`,
        `──────────────────`,
        `🏆 *Result:* ${m.result.summaryText || 'In Progress'}`,
        `📺 Live TV Room: *${appSession.roomCode}*`
      ].join('\n');
    }

    function getFeaturedTvMatch() {
      if (appSession.pinnedTvMatchId) {
        const pinned = getMatchById(appSession.pinnedTvMatchId);
        if (pinned) return pinned;
      }
      // 1. Prefer scorer's activeMatchId if it is currently live
      const activeM = getMatchById(state.activeMatchId);
      if (activeM && activeM.status === 'live') return activeM;
      // 2. Otherwise any match currently live
      const liveM = state.matches.find(m => m.status === 'live');
      if (liveM) return liveM;
      // 3. Otherwise the most recently completed match
      const completedMatches = state.matches.filter(m => m.status === 'completed');
      if (completedMatches.length > 0) return completedMatches[completedMatches.length - 1];
      // 4. Fallback to activeMatchId or Match 1
      return activeM || state.matches[0];
    }

      const m = getFeaturedTvMatch();
      const maxOvers = getMatchOvers(m);

      const switcherBar = `

              📋 Scorecard
            </button>
          ` : ''}
        </div>
      `;

      if (m.status === 'upcoming') {
        return `
          <div class="space-y-4">
            ${switcherBar}
            <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/60 border border-slate-800 rounded-3xl p-6 sm:p-12 text-center shadow-2xl space-y-5">
              <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-black uppercase tracking-widest">
                <span>🕒 UPCOMING</span><span>•</span><span>${escapeHtml(m.label)}</span><span>•</span><span>${escapeHtml(m.stage)}</span>
              </div>
              <div class="text-3xl sm:text-5xl font-black tracking-tight text-white flex flex-wrap items-center justify-center gap-4 sm:gap-6">
                <span>${escapeHtml(getTeamName(m.team1Id, m.seed1 || 'TBD'))}</span>
                <span class="text-lg sm:text-2xl font-black text-emerald-400 px-3 py-1 rounded-xl bg-slate-950/80 border border-slate-800">VS</span>
                <span>${escapeHtml(getTeamName(m.team2Id, m.seed2 || 'TBD'))}</span>
              </div>
              <div class="flex flex-wrap items-center justify-center gap-3 text-xs sm:text-sm text-slate-300 font-semibold">

                <span class="bg-slate-950/70 px-3 py-1.5 rounded-xl border border-slate-800">🏏 ${maxOvers} Overs (${bpo} balls/ov)</span>
                <span class="bg-slate-950/70 px-3 py-1.5 rounded-xl border border-slate-800">${girlsOn ? "👩 Ov 1 Girl's Over (WD/NB=2)" : "👨 Boys Only"}</span>
              </div>
              <p class="text-xs text-slate-400 pt-2">Scoreboard updates automatically as soon as the toss & first ball begin.</p>
            </div>
          </div>
        `;
      }

      const innIdx = m.status === 'completed' ? 1 : (m.currentInnings === 2 ? 1 : 0);
      const inn = m.innings[innIdx];
      const stats = computeInningsStats(inn, m);
      const s1 = computeInningsStats(m.innings[0], m);
      const crr = stats.decimalOvers > 0 ? (stats.runs / stats.decimalOvers) : 0;
      const curOver = inn.overs[inn.overs.length - 1];
      const isGirls = curOver && curOver.isGirlsOver && m.status === 'live';

      const striker = stats.battingMap[inn.strikerId] || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const nonStriker = stats.battingMap[inn.nonStrikerId] || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const bowler = curOver && curOver.bowlerId
        ? (stats.bowlingMap[curOver.bowlerId] || { legalBalls: 0, runsConceded: 0, wickets: 0 })
        : null;

      const sr1 = striker.balls > 0 ? ((striker.runs / striker.balls) * 100).toFixed(1) : '0.0';
      const sr2 = nonStriker.balls > 0 ? ((nonStriker.runs / nonStriker.balls) * 100).toFixed(1) : '0.0';
      const bwEcon = bowler && bowler.legalBalls > 0 ? (bowler.runsConceded / (bowler.legalBalls / bpo)).toFixed(2) : '0.00';

      let equationHtml = '';
      if (m.status === 'completed') {
        equationHtml = `
          <div class="bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
